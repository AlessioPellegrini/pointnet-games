<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Controller Body Gradient -->
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Pad Highlight -->
    <linearGradient id="padHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0" />
    </linearGradient>

    <!-- Button Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Shadow / Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="240" height="240" rx="54" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Background Tech Grid Accent -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="8" y1="64" x2="248" y2="64" />
    <line x1="8" y1="128" x2="248" y2="128" />
    <line x1="8" y1="192" x2="248" y2="192" />
    <line x1="64" y1="8" x2="64" y2="248" />
    <line x1="128" y1="8" x2="128" y2="248" />
    <line x1="192" y1="8" x2="192" y2="248" />
  </g>

  <!-- Controller Shadow -->
  <path d="M 52 108 C 52 86, 74 76, 96 76 L 160 76 C 182 76, 204 86, 204 108 C 204 138, 218 168, 194 186 C 174 200, 154 180, 142 164 L 114 164 C 102 180, 82 200, 62 186 C 38 168, 52 138, 52 108 Z"
        fill="#000" opacity="0.4" transform="translate(0, 6)" />

  <!-- Controller Body -->
  <path d="M 52 108 C 52 86, 74 76, 96 76 L 160 76 C 182 76, 204 86, 204 108 C 204 138, 218 168, 194 186 C 174 200, 154 180, 142 164 L 114 164 C 102 180, 82 200, 62 186 C 38 168, 52 138, 52 108 Z"
        fill="url(#padGrad)" stroke="#475569" stroke-width="2" />

  <!-- Controller Top Bevel Highlight -->
  <path d="M 56 108 C 56 89, 76 80, 96 80 L 160 80 C 180 80, 200 89, 200 108 C 200 118, 196 130, 190 142 C 184 126, 172 116, 156 116 L 100 116 C 84 116, 72 126, 66 142 C 60 130, 56 118, 56 108 Z"
        fill="url(#padHighlight)" opacity="0.35" />

  <!-- D-PAD (Left Side) -->
  <g transform="translate(86, 122)">
    <!-- Base Cross Background -->
    <path d="M -7 -22 L 7 -22 L 7 -7 L 22 -7 L 22 7 L 7 7 L 7 22 L -7 22 L -7 7 L -22 7 L -22 -7 L -7 -7 Z"
          fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    <!-- Up Arrow -->
    <polygon points="0,-18 -4,-12 4,-12" fill="#94a3b8" />
    <!-- Down Arrow -->
    <polygon points="0,18 -4,12 4,12" fill="#94a3b8" />
    <!-- Left Arrow -->
    <polygon points="-18,0 -12,-4 -12,4" fill="#94a3b8" />
    <!-- Right Arrow -->
    <polygon points="18,0 12,-4 12,4" fill="#94a3b8" />
    <!-- Center Indent -->
    <circle cx="0" cy="0" r="3.5" fill="#1e293b" />
  </g>

  <!-- ACTION BUTTONS (Right Side) Diamond Layout -->
  <g transform="translate(170, 122)">
    <!-- Button Base Indent -->
    <circle cx="0" cy="0" r="24" fill="#0f172a" opacity="0.5" />

    <!-- Top Button: Yellow (Y) -->
    <circle cx="0" cy="-14" r="7" fill="#eab308" filter="url(#glow)" />
    <circle cx="0" cy="-14" r="5" fill="#facc15" />
    <circle cx="-1.5" cy="-15.5" r="2" fill="#fef08a" opacity="0.8" />

    <!-- Right Button: Red (B) -->
    <circle cx="14" cy="0" r="7" fill="#ef4444" filter="url(#glow)" />
    <circle cx="14" cy="0" r="5" fill="#f87171" />
    <circle cx="12.5" cy="-1.5" r="2" fill="#fecaca" opacity="0.8" />

    <!-- Bottom Button: Green (A) -->
    <circle cx="0" cy="14" r="7" fill="#10b981" filter="url(#glow)" />
    <circle cx="0" cy="14" r="5" fill="#34d399" />
    <circle cx="-1.5" cy="12.5" r="2" fill="#a7f3d0" opacity="0.8" />

    <!-- Left Button: Blue (X) -->
    <circle cx="-14" cy="0" r="7" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="-14" cy="0" r="5" fill="#60a5fa" />
    <circle cx="-15.5" cy="-1.5" r="2" fill="#bfdbfe" opacity="0.8" />
  </g>

  <!-- Center Console Detail: PointNet Logo / Play Badge -->
  <g transform="translate(128, 114)">
    <circle cx="0" cy="0" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Glowing Play Triangle -->
    <polygon points="-3,-5 -3,5 6,0" fill="#38bdf8" />
  </g>

  <!-- LED Indicators (Center bottom) -->
  <circle cx="122" cy="136" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="126" cy="136" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="130" cy="136" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="134" cy="136" r="1.5" fill="#38bdf8" opacity="0.8" />

  <!-- Bottom Brand Text -->
  <text x="128" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="12" font-weight="800" letter-spacing="3" fill="#38bdf8" text-anchor="middle" opacity="0.9">POINTNET GAMES</text>
</svg>
