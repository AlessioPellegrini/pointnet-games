<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Mahjong Arcade</title>
	<link rel="stylesheet" href="style.css">
	<style>
		/* ============================================================
		   SPLASH SCREEN + FULLSCREEN — game styles live in style.css
		   ============================================================ */
		#splash {
			position: fixed;
			top: 0; left: 0; right: 0; bottom: 0;
			z-index: 900;
			background:
				radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.15) 0%, transparent 60%),
				radial-gradient(circle at 50% 90%, rgba(244, 114, 182, 0.10) 0%, transparent 60%),
				var(--bg);
			display: flex;
			align-items: center;
			justify-content: center;
			transition: opacity 0.35s ease;
			overflow: hidden;
		}

		#splash.hidden { opacity: 0; pointer-events: none; }

		.splash-inner {
			text-align: center;
			padding: 32px;
			max-width: 380px;
			width: 90%;
			max-height: 100vh;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}

		.splash-emoji { font-size: 4.5rem; margin-bottom: 12px; animation: splash-bounce 1.2s ease infinite; line-height: 1; }

		.splash-title {
			font-size: 2.2rem;
			font-weight: 800;
			background: linear-gradient(135deg, var(--accent), #f472b6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			margin-bottom: 10px;
			line-height: 1.2;
		}

		.splash-version {
			font-size: 0.45em;
			font-weight: 700;
			vertical-align: super;
			margin-left: 4px;
			opacity: 0.7;
			background: linear-gradient(135deg, var(--accent), #f472b6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: 0.3px;
		}

		.splash-subtitle { color: #94a3b8; font-size: 1rem; margin-bottom: 20px; line-height: 1.4; }

		.splash-play {
			background: var(--accent);
			color: #0f172a;
			border: none;
			border-radius: 999px;
			font-family: inherit;
			font-size: 1.3rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
			padding: 14px 40px;
			box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4);
			animation: splash-pulse 2s ease-in-out infinite;
			flex-shrink: 0;
		}

		.splash-play:hover { transform: translateY(-2px); }

		.splash-hint { margin-top: 10px; color: #94a3b8; font-size: 0.8rem; }
		.splash-author { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(148, 163, 184, 0.2); color: #94a3b8; font-size: 0.8rem; letter-spacing: 0.3px; width: 100%; }

		@keyframes splash-pulse {
			0%, 100% { box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4); }
			50% { box-shadow: 0 8px 36px rgba(56, 189, 248, 0.7); }
		}

		@keyframes splash-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

		.fs-close {
			position: fixed;
			top: 16px;
			right: 16px;
			z-index: 1000;
			width: 40px;
			height: 40px;
			border: none;
			border-radius: 10px;
			background: rgba(15, 23, 42, 0.7);
			color: #fff;
			font-size: 1.2rem;
			cursor: pointer;
			display: none;
			align-items: center;
			justify-content: center;
			transition: background 0.2s ease;
			backdrop-filter: blur(4px);
		}

		.fs-close:hover { background: rgba(239, 68, 68, 0.85); }
		body.pointnet-games-fs .fs-close { display: flex; }

		@media (max-width: 600px) {
			.splash-inner { padding: 16px; }
			.splash-emoji { font-size: 3rem; margin-bottom: 6px; }
			.splash-title { font-size: 1.5rem !important; margin-bottom: 6px; }
			.splash-subtitle { font-size: 0.85rem; margin-bottom: 12px; }
			.splash-play { font-size: 1rem; padding: 10px 28px; }
			.splash-hint { margin-top: 6px; font-size: 0.7rem; }
			.splash-author { margin-top: 10px; padding-top: 8px; font-size: 0.7rem; }
		}

		@media (orientation: landscape) and (max-height: 650px) {
			.splash-inner { padding: 8px; flex-direction: row; flex-wrap: wrap; gap: 4px 12px; max-width: 100%; }
			.splash-emoji { font-size: 2rem; margin-bottom: 0; }
			.splash-title { font-size: 1.3rem !important; margin-bottom: 0; }
			.splash-subtitle { font-size: 0.75rem; margin-bottom: 0; }
			.splash-play { font-size: 0.9rem; padding: 8px 20px; }
			.splash-hint { display: none; }
			.splash-author { margin-top: 0; padding-top: 0; border-top: none; font-size: 0.65rem; }
		}
	</style>
</head>
<body>

	<div id="splash">
		<div class="splash-inner">
			<div class="splash-emoji">🀄</div>
			<h1 class="splash-title">Mahjong Arcade<sup class="splash-version">v0.7.0</sup></h1>
			<p class="splash-subtitle">Match identical tiles to clear the board. Free tiles go to the tray — two of the same symbol auto-match!</p>
			<button id="splash-play" class="splash-play">🎮 PLAY</button>
			<p class="splash-hint">Tap a free tile to lift it · tap again to send it to the tray</p>
			<p class="splash-author">by Alessio Pellegrini · PointNet</p>
		</div>
	</div>

	<button id="fs-close" class="fs-close" title="Exit fullscreen">✕</button>

	<div class="game-container" id="game" data-game-id="" data-game-slug="mahjong-arcade">
		<div class="game-header">
			<h1 class="game-title">🀄 Mahjong Arcade</h1>
		</div>

		<div class="status-bar">
			<div class="status-item">🎯 <span class="status-value level-value" id="level-label">1</span></div>
			<div class="status-item">⏱️ <span class="status-value" id="timer">0</span></div>
			<div class="status-item">🀄 <span class="status-value pairs" id="pairs-left">0</span></div>
			<div class="status-item">🏆 <span class="status-value" id="score">0</span></div>
			<div class="status-item" id="combo">🔥 <span class="status-value">x0</span></div>
		</div>

		<div class="staging-box" id="staging-box"></div>

		<div class="board-wrap" id="board-wrap">
			<div id="board"></div>
		</div>

		<div class="action-bar">
			<button class="btn" id="btn-hint">💡 Hint</button>
			<button class="btn" id="btn-undo">↩️ Undo</button>
			<button class="btn" id="btn-shuffle">🔀 Shuffle <span id="shuffle-count">x3</span></button>
			<button class="btn" id="btn-new">🔄 New</button>
			<input type="number" id="level-input" class="btn-level-input" min="1" max="300" value="1" aria-label="Level number">
			<button class="btn" id="btn-level-go">Level</button>
		</div>
	</div>

	<div class="overlay" id="overlay">
		<div class="modal">
			<h2 id="modal-title">🏆 Cleared!</h2>
			<p id="modal-stars"></p>
			<p id="modal-stats"></p>
			<button class="btn" id="btn-play-again">🔄 Play again</button>
		</div>
	</div>

	<script src="data.js"></script>
	<script src="engine.js"></script>
	<script src="game.js"></script>
</body>
</html>
