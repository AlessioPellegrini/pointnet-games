<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Mahjong Arcade</title>
	<style>
		:root {
			--bg: #0f172a;
			--bg-panel: #1e293b;
			--text: #e2e8f0;
			--accent: #38bdf8;
			--success: #22c55e;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			user-select: none;
			-webkit-user-select: none;
			touch-action: manipulation;
		}

		.game-container {
			display: flex;
			flex-direction: column;
			height: 100%;
			padding: 8px;
			gap: 8px;
		}

		.game-header { text-align: center; flex-shrink: 0; }

		.game-title {
			font-size: 1.3rem;
			font-weight: 800;
			background: linear-gradient(135deg, var(--accent), #f472b6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: -0.5px;
		}

		.status-bar {
			display: flex;
			justify-content: center;
			gap: 20px;
			background: var(--bg-panel);
			border-radius: 10px;
			padding: 6px 14px;
			flex-shrink: 0;
			font-family: 'Consolas', 'Courier New', monospace;
		}

		.status-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; font-weight: 700; }
		.status-value { color: var(--accent); min-width: 24px; text-align: center; }
		.status-value.pairs { color: var(--success); }

		.board-wrap {
			flex: 1;
			position: relative;
			overflow: hidden;
			min-height: 0;
		}

		#canvas {
			width: 100%;
			height: 100%;
			display: block;
			touch-action: manipulation;
			cursor: pointer;
		}

		.action-bar {
			display: flex;
			justify-content: center;
			gap: 10px;
			flex-shrink: 0;
		}

		.btn {
			padding: 8px 20px;
			border-radius: 999px;
			border: none;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
			font-family: inherit;
			background: var(--bg-panel);
			color: var(--text);
		}
		.btn:hover { background: #3b4c66; }
		.btn:active { transform: scale(0.96); }
	</style>
</head>
<body>
	<div class="game-container">
		<div class="game-header">
			<h1 class="game-title">🀄 Mahjong Arcade</h1>
		</div>

		<div class="status-bar">
			<div class="status-item">⏱️ <span class="status-value" id="timer">0</span></div>
			<div class="status-item">🀄 <span class="status-value pairs" id="pairs-left">0</span></div>
			<div class="status-item">🏆 <span class="status-value" id="score">0</span></div>
		</div>

		<div class="board-wrap" id="board-wrap">
			<canvas id="canvas"></canvas>
		</div>

		<div class="action-bar">
			<button class="btn" id="btn-hint">💡 Hint</button>
			<button class="btn" id="btn-undo">↩️ Undo</button>
			<button class="btn" id="btn-new">🔄 New</button>
		</div>
	</div>

	<script>
	(function () {
		'use strict';

		/* ============================================================
		   STATIC TEST LAYOUT — 2 aligned planes
		   ============================================================ */
		var SYMBOLS = ['🀄','🍀','🌸','🔥','❄️','💎','⭐','🌙','☀️','🍃','💜','🔷'];

		function createRng(seed) {
			var s = seed >>> 0;
			return {
				next: function () {
					s = (s * 1664525 + 1013904223) >>> 0;
					return s / 4294967296;
				}
			};
		}

		function shuffle(arr, rng) {
			for (var i = arr.length - 1; i > 0; i--) {
				var j = Math.floor(rng.next() * (i + 1));
				var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
			}
			return arr;
		}

		var BASE_COORDS = [
			[0,0],[2,0],[4,0],[6,0],
			[0,1],[2,1],[4,1],[6,1],
			[0,2],[2,2],[4,2],[6,2],
			[0,3],[2,3],[4,3],[6,3]
		];

		var UPPER_COORDS = [
			[2,1],[4,1],
			[2,2],[4,2],
			[2,3],[4,3],
			[2,0],[4,0]
		];

		function buildStaticLayout() {
			var allCoords = BASE_COORDS.concat(UPPER_COORDS);
			var lastBest = null;

			for (var attempt = 0; attempt < 100; attempt++) {
				var rng = createRng(42 + attempt);
				var deck = [];
				for (var i = 0; i < SYMBOLS.length; i++) {
					deck.push(SYMBOLS[i]);
					deck.push(SYMBOLS[i]);
				}
				shuffle(deck, rng);

				var tiles = [];
				for (var c = 0; c < allCoords.length; c++) {
					var z = c < BASE_COORDS.length ? 0 : 1;
					tiles.push({
						z: z,
						x: allCoords[c][0],
						y: allCoords[c][1],
						symbol: deck[c],
						label: c + 1,
						removed: false
					});
				}

				var board = buildBoard(tiles);
				if (solveBoard(board)) return tiles;
				lastBest = tiles;
			}
			return lastBest;
		}

		/* ============================================================
		   BOARD MODEL + SOLVER
		   ============================================================ */
		function makeKey(z, x, y) { return z + ',' + x + ',' + y; }

		function buildBoard(tiles) {
			var board = new Map();
			for (var i = 0; i < tiles.length; i++) {
				var t = tiles[i];
				t.key = makeKey(t.z, t.x, t.y);
				board.set(t.key, t);
			}
			return board;
		}

		function hasTile(board, z, x, y) {
			var t = board.get(makeKey(z, x, y));
			return !!t && !t.removed;
		}

		function isFree(board, tile) {
			if (tile.removed) return false;
			if (hasTile(board, tile.z + 1, tile.x, tile.y)) return false;
			var hasLeft = hasTile(board, tile.z, tile.x - 2, tile.y);
			var hasRight = hasTile(board, tile.z, tile.x + 2, tile.y);
			return !(hasLeft && hasRight);
		}

		function solveBoard(board) {
			var tileList = Array.from(board.values());
			var removed = new Set();

			function hasLive(z, x, y) {
				var t = board.get(makeKey(z, x, y));
				return !!t && !t.removed && !removed.has(t.key);
			}

			function isFreeForSolver(t) {
				if (removed.has(t.key)) return false;
				if (hasLive(t.z + 1, t.x, t.y)) return false;
				var hasLeft = hasLive(t.z, t.x - 2, t.y);
				var hasRight = hasLive(t.z, t.x + 2, t.y);
				return !(hasLeft && hasRight);
			}

			function rec() {
				if (removed.size === tileList.length) return true;
				var free = [];
				for (var i = 0; i < tileList.length; i++) {
					var t = tileList[i];
					if (!removed.has(t.key) && isFreeForSolver(t)) free.push(t);
				}
				if (free.length === 0) return false;

				var bySym = {};
				for (var i = 0; i < free.length; i++) {
					var s = free[i].symbol;
					(bySym[s] = bySym[s] || []).push(free[i]);
				}
				var syms = Object.keys(bySym).sort(function (a, b) {
					return bySym[a].length - bySym[b].length;
				});
				for (var g = 0; g < syms.length; g++) {
					var members = bySym[syms[g]];
					for (var i2 = 0; i2 < members.length; i2++) {
						for (var j = i2 + 1; j < members.length; j++) {
							var a = members[i2], b = members[j];
							removed.add(a.key);
							removed.add(b.key);
							if (rec()) return true;
							removed.delete(a.key);
							removed.delete(b.key);
						}
					}
				}
				return false;
			}
			return rec();
		}

		/* ============================================================
		   CANVAS RENDERING — each tile drawn by the SAME function,
		   identical 3D geometry everywhere. Impossible to differ.
		   ============================================================ */
		var canvas = document.getElementById('canvas');
		var ctx = canvas.getContext('2d');

		var TILE_W = 42, TILE_H = 48;
		var THICK = 3;                 // 3D side-face thickness (px)
		var STEP_X = 22, STEP_Y = 48;
		var Z_OFFSET_X = 2, Z_OFFSET_Y = 8;

		var boardWrapEl = document.getElementById('board-wrap');
		var timerEl = document.getElementById('timer');
		var pairsLeftEl = document.getElementById('pairs-left');
		var scoreEl = document.getElementById('score');

		function computeMetrics(tiles) {
			var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, maxZ = 0;
			tiles.forEach(function (t) {
				if (t.x < minX) minX = t.x;
				if (t.x > maxX) maxX = t.x;
				if (t.y < minY) minY = t.y;
				if (t.y > maxY) maxY = t.y;
				if (t.z > maxZ) maxZ = t.z;
			});
			return { minX: minX, maxX: maxX, minY: minY, maxY: maxY, maxZ: maxZ };
		}

		function layoutPos(t, m) {
			return {
				x: (t.x - m.minX) * STEP_X + t.z * Z_OFFSET_X,
				y: (t.y - m.minY) * STEP_Y - t.z * Z_OFFSET_Y
			};
		}

		function boardSize(m) {
			return {
				w: (m.maxX - m.minX) * STEP_X + m.maxZ * Z_OFFSET_X + TILE_W + 6,
				h: (m.maxY - m.minY) * STEP_Y + m.maxZ * Z_OFFSET_Y + TILE_H + 6
			};
		}

		var scale = 1;

		function fitAndRender() {
			var m = computeMetrics(app.tiles);
			var size = boardSize(m);
			var wrapW = boardWrapEl.clientWidth || window.innerWidth;
			var wrapH = boardWrapEl.clientHeight || window.innerHeight;
			scale = Math.min(1, (wrapW - 2) / size.w, (wrapH - 2) / size.h);

			canvas.width = Math.max(1, Math.floor(size.w * scale));
			canvas.height = Math.max(1, Math.floor(size.h * scale));
			ctx.save();
			ctx.setTransform(scale, 0, 0, scale, 0, 0);
			render(m);
			ctx.restore();
		}

		/* The SINGLE drawing routine for a tile: front face + right face +
		   bottom face. Called with the same constants for every tile. */
		function drawTile(t) {
			var m = app._metrics;
			var p = layoutPos(t, m);

			// Front face colour by plane.
			var front = t.z === 0 ? '#e2e8f0' : '#ffffff';
			// Dim free/blocked identically for every tile of the same state.
			ctx.globalAlpha = t.removed ? 0 : (isFree(app.board, t) ? 1 : 0.55);

			// Bottom face (dark).
			ctx.fillStyle = '#475569';
			ctx.beginPath();
			ctx.moveTo(p.x, p.y + TILE_H);
			ctx.lineTo(p.x + THICK, p.y + TILE_H + THICK);
			ctx.lineTo(p.x + TILE_W + THICK, p.y + TILE_H + THICK);
			ctx.lineTo(p.x + TILE_W, p.y + TILE_H);
			ctx.closePath();
			ctx.fill();

			// Right face (mid-dark).
			ctx.fillStyle = '#64748b';
			ctx.beginPath();
			ctx.moveTo(p.x + TILE_W, p.y);
			ctx.lineTo(p.x + TILE_W + THICK, p.y + THICK);
			ctx.lineTo(p.x + TILE_W + THICK, p.y + TILE_H + THICK);
			ctx.lineTo(p.x + TILE_W, p.y + TILE_H);
			ctx.closePath();
			ctx.fill();

			// Front face.
			ctx.fillStyle = front;
			ctx.fillRect(p.x, p.y, TILE_W, TILE_H);
			ctx.strokeStyle = '#94a3b8';
			ctx.lineWidth = 1;
			ctx.strokeRect(p.x, p.y, TILE_W, TILE_H);

			// Symbol.
			ctx.fillStyle = '#1e293b';
			ctx.font = '22px sans-serif';
			ctx.textAlign = 'center';
			ctx.textBaseline = 'middle';
			ctx.fillText(t.label, p.x + TILE_W / 2, p.y + TILE_H / 2);

			// Selected highlight.
			if (app.selected && app.selected.key === t.key) {
				ctx.strokeStyle = '#38bdf8';
				ctx.lineWidth = 3;
				ctx.strokeRect(p.x - 2, p.y - 2, TILE_W + 4, TILE_H + 4);
			}
			// Hint highlight.
			if (t.hinted) {
				ctx.strokeStyle = '#22c55e';
				ctx.lineWidth = 3;
				ctx.strokeRect(p.x - 2, p.y - 2, TILE_W + 4, TILE_H + 4);
			}

			ctx.globalAlpha = 1;
		}

		function render(m) {
			app._metrics = m;
			ctx.clearRect(0, 0, canvas.width / scale, canvas.height / scale);
			// Draw by plane: base first, upper on top.
			for (var z = 0; z <= m.maxZ; z++) {
				for (var i = 0; i < app.tiles.length; i++) {
					if (app.tiles[i].z === z) drawTile(app.tiles[i]);
				}
			}
		}

		/* ============================================================
		   HIT TEST — find tile under (px,py) using the same layout math
		   ============================================================ */
		function hitTest(px, py) {
			var m = app._metrics;
			var tile = null;
			for (var z = 0; z <= m.maxZ; z++) {
				for (var i = 0; i < app.tiles.length; i++) {
					var t = app.tiles[i];
					if (t.z !== z || t.removed) continue;
					var p = layoutPos(t, m);
					if (px >= p.x && px <= p.x + TILE_W &&
					    py >= p.y && py <= p.y + TILE_H) {
						tile = t;
					}
				}
			}
			return tile;
		}

		function canvasPos(e) {
			var rect = canvas.getBoundingClientRect();
			return {
				x: (e.clientX - rect.left) / scale,
				y: (e.clientY - rect.top) / scale
			};
		}

		/* ============================================================
		   APP STATE + GAME FLOW
		   ============================================================ */
		var app = {
			tiles: [],
			board: null,
			selected: null,
			score: 0,
			elapsed: 0,
			timerInterval: null,
			timerStarted: false,
			history: [],
			_metrics: null
		};

		function pairsLeft() {
			var count = 0;
			app.tiles.forEach(function (t) { if (!t.removed) count++; });
			return count / 2;
		}

		function startTimer() {
			if (app.timerInterval) return;
			app.timerStarted = true;
			app.timerInterval = setInterval(function () {
				app.elapsed++;
				timerEl.textContent = app.elapsed;
			}, 1000);
		}

		function stopTimer() {
			if (app.timerInterval) { clearInterval(app.timerInterval); app.timerInterval = null; }
		}

		function handleClickPos(px, py) {
			var tile = hitTest(px, py);
			if (!tile) { app.selected = null; fitAndRender(); return; }
			if (!isFree(app.board, tile)) { app.selected = null; fitAndRender(); return; }
			if (!app.timerStarted) startTimer();

			if (app.selected) {
				if (app.selected.key === tile.key) {
					app.selected = null;
					fitAndRender();
					return;
				}
				if (app.selected.symbol === tile.symbol) {
					match(app.selected, tile);
					return;
				}
				app.selected = null;
			}
			app.selected = tile;
			fitAndRender();
		}

		function match(a, b) {
			a.removed = true;
			b.removed = true;
			app.history.push([a, b]);
			app.selected = null;
			app.score += 100;
			scoreEl.textContent = app.score;
			pairsLeftEl.textContent = pairsLeft();
			fitAndRender();
			if (pairsLeft() === 0) levelComplete();
		}

		function undo() {
			if (app.history.length === 0) return;
			var pair = app.history.pop();
			pair[0].removed = false;
			pair[1].removed = false;
			fitAndRender();
			pairsLeftEl.textContent = pairsLeft();
		}

		function hint() {
			var free = [];
			app.board.forEach(function (t) {
				if (!t.removed && isFree(app.board, t)) free.push(t);
			});
			var bySymbol = {};
			free.forEach(function (t) {
				(bySymbol[t.symbol] = bySymbol[t.symbol] || []).push(t);
			});
			for (var sym in bySymbol) {
				if (bySymbol[sym].length >= 2) {
					bySymbol[sym][0].hinted = true;
					bySymbol[sym][1].hinted = true;
					fitAndRender();
					setTimeout(function () {
						bySymbol[sym][0].hinted = false;
						bySymbol[sym][1].hinted = false;
						fitAndRender();
					}, 2000);
					return;
				}
			}
		}

		function levelComplete() {
			stopTimer();
			modalTitle.textContent = 'Cleared!';
			overlay.style.display = 'flex';
		}

		function startGame() {
			app.tiles = buildStaticLayout();
			app.board = buildBoard(app.tiles);
			app.selected = null;
			app.score = 0;
			app.elapsed = 0;
			app.history = [];
			app.timerStarted = false;
			stopTimer();
			timerEl.textContent = '0';
			scoreEl.textContent = '0';
			pairsLeftEl.textContent = pairsLeft();
			overlay.style.display = 'none';
			fitAndRender();
		}

		var overlay = document.createElement('div');
		var modalTitle = document.createElement('h2');
		overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000;';
		overlay.style.display = 'none';
		modalTitle.style.cssText = 'color:#fff;font-size:2rem;background:#1e293b;padding:24px 40px;border-radius:16px;';
		overlay.appendChild(modalTitle);
		document.body.appendChild(overlay);

		canvas.addEventListener('click', function (e) {
			var pos = canvasPos(e);
			handleClickPos(pos.x, pos.y);
		});

		document.getElementById('btn-hint').addEventListener('click', hint);
		document.getElementById('btn-undo').addEventListener('click', undo);
		document.getElementById('btn-new').addEventListener('click', startGame);

		window.addEventListener('resize', function () {
			if (app.tiles.length) fitAndRender();
		});

		startGame();
	})();
	</script>
</body>
</html>
