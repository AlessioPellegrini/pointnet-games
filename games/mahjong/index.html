<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Mahjong Arcade</title>
	<style>
		:root {
			--bg: #0f172a;
			--bg-panel: #1e293b;
			--text: #e2e8f0;
			--accent: #38bdf8;
			--success: #22c55e;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			user-select: none;
			-webkit-user-select: none;
			touch-action: manipulation;
			-webkit-tap-highlight-color: transparent;
		}

		.game-container {
			display: flex;
			flex-direction: column;
			height: 100%;
			padding: 8px;
			gap: 8px;
		}

		.game-header { text-align: center; flex-shrink: 0; }

		.game-title {
			font-size: 1.3rem;
			font-weight: 800;
			background: linear-gradient(135deg, var(--accent), #f472b6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: -0.5px;
		}

		.status-bar {
			display: flex;
			justify-content: center;
			gap: 20px;
			background: var(--bg-panel);
			border-radius: 10px;
			padding: 6px 14px;
			flex-shrink: 0;
			font-family: 'Consolas', 'Courier New', monospace;
		}

		.status-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; font-weight: 700; }
		.status-value { color: var(--accent); min-width: 24px; text-align: center; }
		.status-value.pairs { color: var(--success); }

		/* ----------------------------------------------------------
		   STAGING BOX — 4 slots where clicked tiles are held.
		   Two matching tiles in the box automatically match.
		   4 tiles without a match = game over.
		   ---------------------------------------------------------- */
		.staging-box {
			display: flex;
			justify-content: center;
			gap: 8px;
			padding: 8px 14px;
			background: var(--bg-panel);
			border-radius: 10px;
			flex-shrink: 0;
			min-height: 60px;
			align-items: center;
		}

		.staging-slot {
			width: 38px;
			height: 48px;
			border: 2px dashed rgba(148, 163, 184, 0.35);
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			opacity: 0.5;
			position: relative;
		}

		.staging-slot.filled {
			border-style: solid;
			border-color: rgba(56, 189, 248, 0.5);
			background: linear-gradient(180deg, #f7f9fc 0%, #e9edf2 100%);
			box-shadow:
				1px 0 0 0 rgba(71, 85, 105, 0.30),
				0 3px 0 0 rgba(71, 85, 105, 0.25),
				1px 3px 0 0 rgba(71, 85, 105, 0.25),
				3px 5px 8px rgba(15, 23, 42, 0.25);
			opacity: 1;
		}

		.board-wrap {
			flex: 1;
			position: relative;
			overflow: hidden;
			min-height: 0;
			background: radial-gradient(circle at 50% 42%, #1e293b 0%, #0b1220 100%);
			border-radius: 14px;
		}

		#board {
			position: absolute;
			top: 0;
			left: 0;
			transform-origin: top left;
			touch-action: none;
		}

		/* ----------------------------------------------------------
		   TILE — every tile is pixel-identical. Rounded corners,
		   soft semi-transparent side faces, subtle gradient face,
		   uniform drop shadow (same blur on all sides: cannot
		   create the asymmetric edge illusion).
		   ---------------------------------------------------------- */
		.tile {
			position: absolute;
			top: 0;
			left: 0;
			width: 42px;
			height: 56px;
			border-radius: 4px;
			background: linear-gradient(180deg, #f7f9fc 0%, #e9edf2 100%);
			color: #1e293b;
			box-shadow:
				1px 0 0 0 rgba(71, 85, 105, 0.30),                /* right face (soft 3D)  */
				0 3px 0 0 rgba(71, 85, 105, 0.25),                /* bottom face (soft 3D) */
				1px 3px 0 0 rgba(71, 85, 105, 0.25),              /* bottom-right corner   */
				rgba(50, 50, 93, 0.25) 0px 50px 100px -20px,       /* deep ambient shadow   */
				rgba(0, 0, 0, 0.3) 0px 30px 60px -30px,            /* tight dark shadow     */
				rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;     /* face top inner edge   */
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 800;
			cursor: pointer;
			transition: transform 0.12s ease;
			transform: translate(var(--tx), var(--ty));
			will-change: transform;
		}

		.tile.z0 { z-index: 1; }
		.tile.z1 {
			z-index: 2;
			background: linear-gradient(180deg, #ffffff 0%, #f1f4f8 100%);
		}

		/* Face-down (covered) tiles — memory mechanic.
		   Symbol is HIDDEN: the sym element is invisible and the
		   tile shows a plain back. Always fully opaque, even when
		   blocked (no peeking through semi-transparency). */
		.tile.face-down {
			background: linear-gradient(135deg, #1e3a5f 0%, #0f2742 100%);
			color: #e2e8f0;
			opacity: 1;
		}
		.tile.face-down .tile-sym { visibility: hidden; }
		.tile.face-down::after {
			content: '?';
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			font-weight: 900;
			color: rgba(226, 232, 240, 0.45);
			pointer-events: none;
		}
		.tile.face-down.blocked:hover { opacity: 1; }

		.tile:hover { transform: translate(var(--tx), var(--ty)) scale(1.05); }

		.tile-overlay {
			position: absolute;
			inset: 0;
			border-radius: 4px;
			opacity: 0;
			transition: opacity 0.12s ease;
			background: rgba(255, 255, 255, 0.55);
			box-shadow: 0 0 0 2px var(--accent) inset;
			pointer-events: none;
		}
		.tile:hover .tile-overlay { opacity: 1; }

		.tile.blocked:not(.face-down) { opacity: 0.5; cursor: default; }
		.tile.blocked:hover { transform: translate(var(--tx), var(--ty)); }
		.tile.blocked:hover .tile-overlay { opacity: 0; }

		.tile.removed { visibility: hidden; pointer-events: none; }

		/* Tiles inside the staging box disappear from the board */
		.tile.in-staging { visibility: hidden; pointer-events: none; }

		.tile.selected { outline: 3px solid var(--accent); outline-offset: 2px; z-index: 3; }
		.tile.hinted { outline: 3px solid var(--success); outline-offset: 2px; z-index: 3; }

		/* Dragging (peek): lift over everything, no transition lag */
		.tile.dragging {
			z-index: 100;
			transition: none;
			touch-action: none;
			cursor: grabbing;
			transform: translate(var(--tx), var(--ty));
		}
		.tile.dragging .tile-overlay { opacity: 0; }

		.tile-sym { font-size: 20px; line-height: 1; }

		.plane-badge {
			position: absolute;
			top: 3px;
			left: 4px;
			font-size: 8px;
			font-weight: 900;
			line-height: 1;
			padding: 2px 4px;
			border-radius: 5px;
			color: #fff;
			background: #475569;
		}
		.plane-badge.p2 { background: #2563eb; }

		.num-badge {
			position: absolute;
			top: 3px;
			right: 4px;
			font-size: 8px;
			font-weight: 900;
			line-height: 1;
			padding: 2px 4px;
			border-radius: 5px;
			color: #fff;
			background: rgba(30, 41, 59, 0.55);
		}

		.action-bar {
			display: flex;
			justify-content: center;
			gap: 10px;
			flex-shrink: 0;
		}

		.btn {
			padding: 8px 20px;
			border-radius: 999px;
			border: none;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
			font-family: inherit;
			background: var(--bg-panel);
			color: var(--text);
		}
		.btn:hover { background: #3b4c66; }
		.btn:active { transform: scale(0.96); }

		.overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.7);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}
		.overlay.show { display: flex; }

		.modal {
			background: var(--bg-panel);
			padding: 24px 40px;
			border-radius: 16px;
			text-align: center;
			display: flex;
			flex-direction: column;
			gap: 12px;
			align-items: center;
		}
		.modal h2 { font-size: 1.6rem; }
		.modal p { color: #94a3b8; font-weight: 600; }

		/* ----------------------------------------------------------
		   MOBILE — maximise board space on small screens
		   ---------------------------------------------------------- */
		@media (max-width: 480px) {
			.game-container { padding: 4px; gap: 4px; }
			.status-bar { padding: 4px 10px; gap: 12px; }
			.staging-box { padding: 4px 8px; gap: 6px; min-height: 50px; }
			.staging-slot { width: 32px; height: 42px; font-size: 16px; }
			.btn { padding: 6px 14px; font-size: 0.8rem; }
			.game-title { font-size: 1.1rem; }
			.status-item { font-size: 0.8rem; }
			.tile-sym { font-size: 18px; }
			.board-wrap { border-radius: 10px; }
		}
	</style>
</head>
<body>
	<div class="game-container">
		<div class="game-header">
			<h1 class="game-title">🀄 Mahjong Arcade</h1>
		</div>

		<div class="status-bar">
			<div class="status-item">⏱️ <span class="status-value" id="timer">0</span></div>
			<div class="status-item">🀄 <span class="status-value pairs" id="pairs-left">0</span></div>
			<div class="status-item">🏆 <span class="status-value" id="score">0</span></div>
		</div>

		<div class="staging-box" id="staging-box"></div>

		<div class="board-wrap" id="board-wrap">
			<div id="board"></div>
		</div>

		<div class="action-bar">
			<button class="btn" id="btn-hint">💡 Hint</button>
			<button class="btn" id="btn-undo">↩️ Undo</button>
			<button class="btn" id="btn-new">🔄 New</button>
		</div>
	</div>

	<div class="overlay" id="overlay">
		<div class="modal">
			<h2 id="modal-title">🏆 Cleared!</h2>
			<p id="modal-stats"></p>
			<button class="btn" id="btn-play-again">🔄 Play again</button>
		</div>
	</div>

	<script>
	(function () {
		'use strict';

		/* ============================================================
		   CONSTANTS
		   ============================================================ */
		var MAX_STAGING = 4;           // staging box capacity
		var FACE_DOWN_PAIRS = 1;       // how many pairs start covered (memory)

		/* ============================================================
		   SYMBOLS + RNG
		   ============================================================ */
		var SYMBOLS = ['🀄', '🍀', '🌸', '🔥', '❄️', '💎', '⭐', '🌙', '☀️', '🍃', '💜', '🔷'];

		function createRng(seed) {
			var s = seed >>> 0;
			return {
				next: function () {
					s = (s * 1664525 + 1013904223) >>> 0;
					return s / 4294967296;
				}
			};
		}

		function shuffle(arr, rng) {
			for (var i = arr.length - 1; i > 0; i--) {
				var j = Math.floor(rng.next() * (i + 1));
				var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
			}
			return arr;
		}

		/* ============================================================
		   STATIC TEST LAYOUT — 2 aligned planes
		   ============================================================ */
		var BASE_COORDS = [
			[0, 0], [2, 0], [4, 0], [6, 0],
			[0, 1], [2, 1], [4, 1], [6, 1],
			[0, 2], [2, 2], [4, 2], [6, 2],
			[0, 3], [2, 3], [4, 3], [6, 3]
		];

		var UPPER_COORDS = [
			[2, 1], [4, 1],
			[2, 2], [4, 2],
			[2, 3], [4, 3],
			[2, 0], [4, 0]
		];

		function buildStaticLayout() {
			var allCoords = BASE_COORDS.concat(UPPER_COORDS);
			var lastBest = null;

			for (var attempt = 0; attempt < 100; attempt++) {
				var rng = createRng(42 + attempt);
				var deck = [];
				for (var i = 0; i < SYMBOLS.length; i++) {
					deck.push(SYMBOLS[i]);
					deck.push(SYMBOLS[i]);
				}
				shuffle(deck, rng);

				var tiles = [];
				for (var c = 0; c < allCoords.length; c++) {
					var z = c < BASE_COORDS.length ? 0 : 1;
					tiles.push({
						z: z,
						x: allCoords[c][0],
						y: allCoords[c][1],
						symbol: deck[c],
						label: c + 1,
						removed: false,
						staging: false,
						faceDown: false,
						hinted: false
					});
				}

				var board = buildBoard(tiles);
				if (solveBoard(board)) {
					applyFaceDown(tiles, FACE_DOWN_PAIRS);
					return tiles;
				}
				lastBest = tiles;
			}
			applyFaceDown(lastBest, FACE_DOWN_PAIRS);
			return lastBest;
		}

		/* Cover numPairs random pairs of tiles (memory mechanic) */
		function applyFaceDown(tiles, numPairs) {
			var done = 0;
			var guard = 0;
			while (done < numPairs && guard < 50) {
				guard++;
				var idx = Math.floor(Math.random() * tiles.length);
				if (tiles[idx].faceDown) continue;
				var sym = tiles[idx].symbol;
				var pairIdx = -1;
				for (var i = 0; i < tiles.length; i++) {
					if (i !== idx && tiles[i].symbol === sym && !tiles[i].faceDown) {
						pairIdx = i;
						break;
					}
				}
				if (pairIdx !== -1) {
					tiles[idx].faceDown = true;
					tiles[pairIdx].faceDown = true;
					done++;
				}
			}
		}

		/* ============================================================
		   BOARD MODEL + SOLVER
		   ============================================================ */
		function makeKey(z, x, y) { return z + ',' + x + ',' + y; }

		function buildBoard(tiles) {
			var board = new Map();
			for (var i = 0; i < tiles.length; i++) {
				var t = tiles[i];
				t.key = makeKey(t.z, t.x, t.y);
				board.set(t.key, t);
			}
			return board;
		}

		/* A tile blocks other tiles only if it's still on the board
		   (not removed, not moved into the staging box). */
		function hasTile(board, z, x, y) {
			var t = board.get(makeKey(z, x, y));
			return !!t && !t.removed && !t.staging;
		}

		function isFree(board, tile) {
			if (tile.removed || tile.staging) return false;
			if (hasTile(board, tile.z + 1, tile.x, tile.y)) return false;
			var hasLeft = hasTile(board, tile.z, tile.x - 2, tile.y);
			var hasRight = hasTile(board, tile.z, tile.x + 2, tile.y);
			return !(hasLeft && hasRight);
		}

		function solveBoard(board) {
			var tileList = Array.from(board.values()).filter(function (t) {
				return !t.staging;
			});
			var removed = new Set();

			function hasLive(z, x, y) {
				var t = board.get(makeKey(z, x, y));
				return !!t && !t.removed && !t.staging && !removed.has(t.key);
			}

			function isFreeForSolver(t) {
				if (removed.has(t.key)) return false;
				if (hasLive(t.z + 1, t.x, t.y)) return false;
				var hasLeft = hasLive(t.z, t.x - 2, t.y);
				var hasRight = hasLive(t.z, t.x + 2, t.y);
				return !(hasLeft && hasRight);
			}

			function rec() {
				if (removed.size === tileList.length) return true;
				var free = [];
				for (var i = 0; i < tileList.length; i++) {
					var t = tileList[i];
					if (!removed.has(t.key) && isFreeForSolver(t)) free.push(t);
				}
				if (free.length === 0) return false;

				var bySym = {};
				for (var i = 0; i < free.length; i++) {
					var s = free[i].symbol;
					(bySym[s] = bySym[s] || []).push(free[i]);
				}
				var syms = Object.keys(bySym).sort(function (a, b) {
					return bySym[a].length - bySym[b].length;
				});
				for (var g = 0; g < syms.length; g++) {
					var members = bySym[syms[g]];
					for (var i2 = 0; i2 < members.length; i2++) {
						for (var j = i2 + 1; j < members.length; j++) {
							var a = members[i2], b = members[j];
							removed.add(a.key);
							removed.add(b.key);
							if (rec()) return true;
							removed.delete(a.key);
							removed.delete(b.key);
						}
					}
				}
				return false;
			}
			return rec();
		}

		/* ============================================================
		   GEOMETRY — integer pixels for every tile.
		   The board element is the ONLY thing that gets scaled.
		   ============================================================ */
		var TILE_W = 42, TILE_H = 56;
		var SIDE_R = 2;                 // right face (px)
		var SIDE_B = 3;                 // bottom face (px)
		var STEP_X = 22;                // horizontal pitch between x-cells (2 cells = 44px)
		var STEP_Y = 61;                // vertical pitch between rows
		var Z_OFFSET_X = 3;             // diagonal plane shift
		var Z_OFFSET_Y = 9;
		var PAD = 8;                    // breathing room around the board

		function computeMetrics(tiles) {
			var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, maxZ = 0;
			tiles.forEach(function (t) {
				if (t.x < minX) minX = t.x;
				if (t.x > maxX) maxX = t.x;
				if (t.y < minY) minY = t.y;
				if (t.y > maxY) maxY = t.y;
				if (t.z > maxZ) maxZ = t.z;
			});
			return { minX: minX, maxX: maxX, minY: minY, maxY: maxY, maxZ: maxZ };
		}

		/* Top pad = max plane thickness. Pushes the whole stack down so
		   upper-plane tiles at the first row are NEVER clipped at the
		   top of the board. (This was the 23/24 bug: their top 8px were
		   cut off by overflow:hidden in every previous version.) */
		function layoutPos(t, m) {
			var topPad = m.maxZ * Z_OFFSET_Y;
			return {
				x: PAD + (t.x - m.minX) * STEP_X + t.z * Z_OFFSET_X,
				y: PAD + topPad + (t.y - m.minY) * STEP_Y - t.z * Z_OFFSET_Y
			};
		}

		function boardSize(m) {
			var topPad = m.maxZ * Z_OFFSET_Y;
			return {
				w: PAD + (m.maxX - m.minX) * STEP_X + m.maxZ * Z_OFFSET_X + TILE_W + SIDE_R + PAD,
				h: PAD + topPad + (m.maxY - m.minY) * STEP_Y + TILE_H + SIDE_B + PAD
			};
		}

		/* ============================================================
		   DOM TILES
		   ============================================================ */
		var wrap = document.getElementById('board-wrap');
		var boardEl = document.getElementById('board');
		var timerEl = document.getElementById('timer');
		var pairsLeftEl = document.getElementById('pairs-left');
		var scoreEl = document.getElementById('score');
		var overlayEl = document.getElementById('overlay');
		var modalTitle = document.getElementById('modal-title');
		var modalStats = document.getElementById('modal-stats');
		var stagingBoxEl = document.getElementById('staging-box');

		function createTileEl(t, i) {
			var el = document.createElement('div');
			el.className = 'tile z' + t.z;
			el.dataset.index = i;

			var overlay = document.createElement('div');
			overlay.className = 'tile-overlay';

			var sym = document.createElement('span');
			sym.className = 'tile-sym';
			el._symEl = sym;

			var plane = document.createElement('span');
			plane.className = 'plane-badge' + (t.z === 1 ? ' p2' : '');
			plane.textContent = t.z + 1;

			var num = document.createElement('span');
			num.className = 'num-badge';
			num.textContent = t.label;

			el.appendChild(overlay);
			el.appendChild(sym);
			el.appendChild(plane);
			el.appendChild(num);
			return el;
		}

		function rebuildBoard() {
			boardEl.innerHTML = '';
			app.tileEls = [];
			app._metrics = computeMetrics(app.tiles);
			app._boardSize = boardSize(app._metrics);

			/* Paint order: plane first (base below upper), then row,
			   then column — so tiles are stacked exactly like a real
			   mahjong board and later elements paint on top. */
			var order = app.tiles.map(function (t, i) { return i; }).sort(function (a, b) {
				var ta = app.tiles[a], tb = app.tiles[b];
				if (ta.z !== tb.z) return ta.z - tb.z;
				if (ta.y !== tb.y) return ta.y - tb.y;
				return ta.x - tb.x;
			});

			for (var k = 0; k < order.length; k++) {
				var idx = order[k];
				var t = app.tiles[idx];
				var el = createTileEl(t, idx);
				var pos = layoutPos(t, app._metrics);
				el.style.setProperty('--tx', pos.x + 'px');
				el.style.setProperty('--ty', pos.y + 'px');
				boardEl.appendChild(el);
				app.tileEls[idx] = el;
			}
			updateStates();
			fitBoard();
		}

		function updateStates() {
			for (var i = 0; i < app.tiles.length; i++) {
				var t = app.tiles[i];
				var el = app.tileEls[i];
				if (!el) continue;
				el.classList.toggle('removed', t.removed);
				el.classList.toggle('in-staging', t.staging && !t.removed);
				el.classList.toggle('blocked', !t.removed && !t.staging && !isFree(app.board, t));
				el.classList.toggle('face-down', t.faceDown && !t.staging && !t.removed);
				el.classList.toggle('hinted', !!t.hinted);
				if (el._symEl) {
					el._symEl.textContent = t.faceDown ? '🀄' : t.symbol;
				}
			}
		}

		/* ============================================================
		   FITTING — scale the whole board, never individual tiles.
		   ============================================================ */
		function fitBoard() {
			var size = app._boardSize;
			var wrapW = wrap.clientWidth || window.innerWidth;
			var wrapH = wrap.clientHeight || window.innerHeight;
			var s = Math.min((wrapW - 4) / size.w, (wrapH - 4) / size.h);

			boardEl.style.width = size.w + 'px';
			boardEl.style.height = size.h + 'px';
			boardEl.style.transform = 'scale(' + s + ')';
			boardEl.style.left = Math.round((wrapW - size.w * s) / 2) + 'px';
			boardEl.style.top = Math.round((wrapH - size.h * s) / 2) + 'px';
		}

		/* ============================================================
		   APP STATE + GAME FLOW
		   ============================================================ */
		var app = {
			tiles: [],
			board: null,
			staging: [],          // tiles in the staging box (max 4)
			peeking: null,        // face-down tile currently revealed
			tileEls: [],
			score: 0,
			elapsed: 0,
			timerInterval: null,
			timerStarted: false,
			history: [],
			_metrics: null,
			_boardSize: null
		};

		function pairsLeft() {
			var count = 0;
			app.tiles.forEach(function (t) { if (!t.removed) count++; });
			return count / 2;
		}

		function startTimer() {
			if (app.timerInterval) return;
			app.timerStarted = true;
			app.timerInterval = setInterval(function () {
				app.elapsed++;
				timerEl.textContent = app.elapsed;
			}, 1000);
		}

		function stopTimer() {
			if (app.timerInterval) { clearInterval(app.timerInterval); app.timerInterval = null; }
		}

		/* ============================================================
		   STAGING BOX — click a free tile to send it here.
		   Two same symbols → auto-match. 4 without match → game over.
		   ============================================================ */
		function renderStaging() {
			stagingBoxEl.innerHTML = '';
			for (var i = 0; i < MAX_STAGING; i++) {
				var slot = document.createElement('div');
				slot.className = 'staging-slot';
				if (i < app.staging.length) {
					slot.classList.add('filled');
					slot.textContent = app.staging[i].symbol;
				}
				stagingBoxEl.appendChild(slot);
			}
		}

		function moveToStaging(tile) {
			if (app.staging.length >= MAX_STAGING) return;
			if (tile.staging || tile.removed) return;

			/* Flight animation: capture source position & make a clone
			   while the tile is still visible on the board. */
			var srcEl = app.tileEls[app.tiles.indexOf(tile)];
			var srcRect = null;
			var flyer = null;
			if (srcEl) {
				srcRect = srcEl.getBoundingClientRect();
				flyer = srcEl.cloneNode(true);
				flyer.classList.remove('dragging', 'in-staging', 'removed', 'blocked', 'selected', 'hinted');
				flyer.style.cssText =
					'position:fixed;margin:0;z-index:500;pointer-events:none;will-change:transform;' +
					'transition:transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 250ms ease;' +
					'left:' + srcRect.left + 'px;top:' + srcRect.top + 'px;' +
					'width:' + srcRect.width + 'px;height:' + srcRect.height + 'px;';
			}

			var pendingSlotIdx = app.staging.length;

			app.staging.push(tile);
			tile.staging = true;
			tile.faceDown = false;

			/* Auto-match: check if same symbol already in the box */
			var matched = false;
			for (var i = 0; i < app.staging.length - 1; i++) {
				var prev = app.staging[i];
				if (prev.symbol === tile.symbol && prev !== tile) {
					prev.staging = false;
					tile.staging = false;
					prev.removed = true;
					tile.removed = true;
					app.staging = app.staging.filter(function (t) {
						return t !== prev && t !== tile;
					});
					app.history.push([prev, tile]);
					app.score += 100;
					scoreEl.textContent = app.score;
					matched = true;
					break;
				}
			}

			pairsLeftEl.textContent = pairsLeft();
			updateStates();
			renderStaging();

			/* Launch the flying clone towards its slot */
			if (flyer) {
				var slot = stagingBoxEl.children[Math.min(pendingSlotIdx, MAX_STAGING - 1)] || stagingBoxEl;
				var dstRect = slot.getBoundingClientRect();
				var dx = dstRect.left - srcRect.left + (dstRect.width - srcRect.width) / 2;
				var dy = dstRect.top - srcRect.top + (dstRect.height - srcRect.height) / 2;
				var s = Math.max(0.1, Math.min(1,
					dstRect.width / srcRect.width,
					dstRect.height / srcRect.height
				));
				document.body.appendChild(flyer);
				flyer.offsetWidth; /* force reflow to start the transition */
				flyer.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
				if (matched) flyer.style.opacity = '0';
				setTimeout(function () { flyer.remove(); }, 350);
			}

			/* Game over: 4 tiles in the box without any match */
			if (!matched && app.staging.length >= MAX_STAGING) {
				stopTimer();
				modalTitle.textContent = '💀 Staging Full!';
				modalStats.textContent = '4 tiles, no match — try again!';
				overlayEl.classList.add('show');
				return;
			}

			if (pairsLeft() === 0) levelComplete();
		}

		/* ============================================================
		   CLICK / TAP LOGIC
		   face-down: 1st click reveals, 2nd click sends to staging.
		   face-up: 1st click sends to staging.
		   If a revealed tile matches one already in staging →
		   auto-match without an extra click.
		   ============================================================ */
		function handleTileClick(tile) {
			if (tile.removed || tile.staging) return;
			if (!isFree(app.board, tile)) {
				app.peeking = null;
				updateStates();
				return;
			}
			if (!app.timerStarted) startTimer();

			/* Case 1: covered tile → reveal (cover previous peeked) */
			if (tile.faceDown) {
				if (app.peeking && app.peeking.key !== tile.key) {
					app.peeking.faceDown = true;
				}
				tile.faceDown = false;
				app.peeking = tile;

				/* If its match is already in staging → auto-match */
				for (var i = 0; i < app.staging.length; i++) {
					if (app.staging[i].symbol === tile.symbol) {
						app.peeking = null;
						moveToStaging(tile);
						return;
					}
				}

				updateStates();
				return;
			}

			/* Case 2: click on the currently peeked tile → staging */
			if (app.peeking && app.peeking.key === tile.key) {
				app.peeking = null;
				moveToStaging(tile);
				return;
			}

			/* Case 3: face-up tile → staging (any peeking tile re-covers) */
			if (app.peeking) {
				app.peeking.faceDown = true;
				app.peeking = null;
			}
			moveToStaging(tile);
		}

		function match() {
			/* Kept for downstream compat — matches are automatic in staging. */
		}

		function undo() {
			if (app.history.length === 0) return;
			var pair = app.history.pop();
			pair[0].removed = false;
			pair[1].removed = false;
			pair[0].faceDown = false;
			pair[1].faceDown = false;
			pair[0].staging = false;
			pair[1].staging = false;
			updateStates();
			renderStaging();
			pairsLeftEl.textContent = pairsLeft();
		}

		function hint() {
			var free = [];
			app.board.forEach(function (t) {
				if (!t.removed && !t.staging && isFree(app.board, t)) free.push(t);
			});
			var bySymbol = {};
			free.forEach(function (t) {
				(bySymbol[t.symbol] = bySymbol[t.symbol] || []).push(t);
			});
			for (var sym in bySymbol) {
				if (bySymbol[sym].length >= 2) {
					bySymbol[sym][0].hinted = true;
					bySymbol[sym][1].hinted = true;
					updateStates();
					setTimeout(function () {
						bySymbol[sym][0].hinted = false;
						bySymbol[sym][1].hinted = false;
						updateStates();
					}, 2000);
					return;
				}
			}
		}

		function levelComplete() {
			stopTimer();
			modalTitle.textContent = '🏆 Cleared!';
			modalStats.textContent = 'Time: ' + app.elapsed + 's   ·   Score: ' + app.score;
			overlayEl.classList.add('show');
		}

		function startGame() {
			stopTimer();
			app.tiles = buildStaticLayout();
			app.board = buildBoard(app.tiles);
			app.staging = [];
			app.peeking = null;
			app.tileEls = [];
			app.score = 0;
			app.elapsed = 0;
			app.history = [];
			app.timerStarted = false;

			app._metrics = computeMetrics(app.tiles);
			app._boardSize = boardSize(app._metrics);

			timerEl.textContent = '0';
			scoreEl.textContent = '0';
			pairsLeftEl.textContent = pairsLeft();
			overlayEl.classList.remove('show');
			renderStaging();
			rebuildBoard();
		}

		/* ============================================================
		   DRAG TO PEEK — pointer events cover mouse + touch.
		   Tiles can be lifted and moved; on release they snap back.
		   Movement < 5px is treated as a normal click.
		   ============================================================ */
		var drag = {
			active: false,
			el: null,
			tile: null,
			startX: 0,
			startY: 0,
			baseX: 0,
			baseY: 0,
			moved: false
		};

		function tileFromEvent(e) {
			var el = e.target.closest('.tile');
			if (!el) return null;
			var idx = parseInt(el.dataset.index, 10);
			var tile = app.tiles[idx];
			if (!tile || tile.removed || tile.staging) return null;
			return { el: el, tile: tile };
		}

		boardEl.addEventListener('pointerdown', function (e) {
			var hit = tileFromEvent(e);
			if (!hit) {
				app.peeking = null;
				updateStates();
				return;
			}
			if (!isFree(app.board, hit.tile)) return;

			drag.active = true;
			drag.el = hit.el;
			drag.tile = hit.tile;
			drag.startX = e.clientX;
			drag.startY = e.clientY;
			drag.baseX = parseInt(hit.el.style.getPropertyValue('--tx'), 10);
			drag.baseY = parseInt(hit.el.style.getPropertyValue('--ty'), 10);
			drag.moved = false;
			hit.el.classList.add('dragging');
			try { hit.el.setPointerCapture(e.pointerId); } catch (err) {}
		});

		boardEl.addEventListener('pointermove', function (e) {
			if (!drag.active) return;
			var dx = e.clientX - drag.startX;
			var dy = e.clientY - drag.startY;
			if (Math.abs(dx) > 4 || Math.abs(dy) > 4) drag.moved = true;
			if (!drag.moved) return;
			drag.el.style.setProperty('--tx', (drag.baseX + dx) + 'px');
			drag.el.style.setProperty('--ty', (drag.baseY + dy) + 'px');
		});

		function endDrag() {
			if (!drag.active) return;
			var el = drag.el;
			var tile = drag.tile;
			var wasClick = !drag.moved;

			drag.active = false;
			drag.el = null;
			drag.tile = null;

			/* Snap back with animation */
			el.classList.remove('dragging');
			el.style.setProperty('--tx', drag.baseX + 'px');
			el.style.setProperty('--ty', drag.baseY + 'px');

			if (wasClick) handleTileClick(tile);
		}

		boardEl.addEventListener('pointerup', endDrag);
		boardEl.addEventListener('pointercancel', endDrag);

		document.getElementById('btn-hint').addEventListener('click', hint);
		document.getElementById('btn-undo').addEventListener('click', undo);
		document.getElementById('btn-new').addEventListener('click', startGame);
		document.getElementById('btn-play-again').addEventListener('click', startGame);

		window.addEventListener('resize', function () {
			if (app.tiles.length) fitBoard();
		});

		startGame();
	})();
	</script>
</body>
</html>
