<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Mahjong Arcade</title>
	<style>
		:root {
			--bg: #0f172a;
			--bg-panel: #1e293b;
			--bg-tile: #f8fafc;
			--bg-tile-dark: #cbd5e1;
			--border: #0b1220;
			--text: #e2e8f0;
			--text-dim: #94a3b8;
			--accent: #38bdf8;
			--accent-2: #f472b6;
			--gold: #fbbf24;
			--danger: #ef4444;
			--success: #22c55e;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			user-select: none;
			-webkit-user-select: none;
			touch-action: manipulation;
		}

		.game-container {
			display: flex;
			flex-direction: column;
			height: 100%;
			padding: 8px;
			gap: 8px;
		}

		.game-header { text-align: center; flex-shrink: 0; }

		.game-title {
			font-size: 1.3rem;
			font-weight: 800;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: -0.5px;
		}

		.status-bar {
			display: flex;
			justify-content: center;
			gap: 20px;
			background: var(--bg-panel);
			border-radius: 10px;
			padding: 6px 14px;
			flex-shrink: 0;
			font-family: 'Consolas', 'Courier New', monospace;
		}

		.status-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; font-weight: 700; }
		.status-value { color: var(--accent); min-width: 24px; text-align: center; }
		.status-value.time { color: var(--text); }
		.status-value.pairs { color: var(--success); }

		.board-wrap {
			flex: 1;
			position: relative;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 0;
		}

		#board {
			position: relative;
			transform-origin: top left;
		}

		.tile {
			position: absolute;
			width: 42px;
			height: 48px;
			background: linear-gradient(145deg, #ffffff, var(--bg-tile-dark));
			border: 1px solid #94a3b8;
			border-radius: 6px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 22px;
			box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.6);
			cursor: pointer;
			transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
			color: #1e293b;
			/* Only free tiles can be clicked: covered/blocked tiles are
			   not interactive, so clicks pass through to the tile on top. */
			pointer-events: none;
		}

		.tile.free { filter: brightness(1.05); pointer-events: auto; }
		.tile.blocked { filter: brightness(0.62) saturate(0.7); cursor: default; pointer-events: none; }
		.tile.selected {
			transform: translateY(-6px) scale(1.08);
			box-shadow: 0 8px 16px rgba(56, 189, 248, 0.5), 0 0 0 3px var(--accent);
			z-index: 200 !important;
		}
		.tile.match-hint { box-shadow: 0 0 0 3px var(--success); }
		.tile.removed { display: none; }

		.action-bar {
			display: flex;
			justify-content: center;
			gap: 10px;
			flex-shrink: 0;
		}

		.btn {
			padding: 8px 20px;
			border-radius: 999px;
			border: none;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
			font-family: inherit;
			background: var(--bg-panel);
			color: var(--text);
		}

		.btn:hover { background: #3b4c66; }
		.btn:active { transform: scale(0.96); }

		.overlay {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, 0.7);
			backdrop-filter: blur(4px);
			z-index: 1000;
		}
		.overlay.show { display: flex; }

		.modal {
			background: var(--bg-panel);
			border-radius: 16px;
			padding: 28px 32px;
			text-align: center;
			max-width: 340px;
			width: 90%;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
		}
		.modal-emoji { font-size: 3rem; margin-bottom: 8px; }
		.modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
		.modal-text { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 18px; }
		.modal-actions { display: flex; gap: 10px; justify-content: center; }
		.btn-primary { background: var(--accent); color: #0f172a; }
		.btn-primary:hover { background: #7dd3fc; }

		@media (max-height: 500px) {
			.game-title { font-size: 1rem; }
			.status-bar { padding: 3px 10px; gap: 12px; font-size: 0.8rem; }
			.btn { padding: 5px 14px; font-size: 0.8rem; }
		}
	</style>
</head>
<body>
	<div class="game-container" id="game" data-game-id="" data-game-slug="mahjong">
		<div class="game-header">
			<h1 class="game-title">🀄 Mahjong Arcade</h1>
		</div>

		<div class="status-bar">
			<div class="status-item">⏱️ <span class="status-value time" id="timer">0</span></div>
			<div class="status-item">🀄 <span class="status-value pairs" id="pairs-left">0</span></div>
			<div class="status-item">🏆 <span class="status-value" id="score">0</span></div>
		</div>

		<div class="board-wrap" id="board-wrap">
			<div id="board"></div>
		</div>

		<div class="action-bar">
			<button class="btn" id="btn-hint">💡 Hint</button>
			<button class="btn" id="btn-undo">↩️ Undo</button>
			<button class="btn" id="btn-new">🔄 New</button>
		</div>
	</div>

	<div class="overlay" id="overlay">
		<div class="modal">
			<div class="modal-emoji" id="modal-emoji">🎉</div>
			<h2 class="modal-title" id="modal-title">Level Complete!</h2>
			<p class="modal-text" id="modal-text"></p>
			<div class="modal-actions">
				<button class="btn btn-primary" id="modal-btn">▶ Next Level</button>
			</div>
		</div>
	</div>

	<script>
	(function () {
		'use strict';

		/* ============================================================
		   LEVEL CONFIG (Phase 3 will expand this table)
		   ============================================================ */
		var LEVELS = [
			{ shape: 'cross', layers: 3, targetTiles: 36, timeLimit: 180 },
			{ shape: 'cross', layers: 3, targetTiles: 44, timeLimit: 180 },
			{ shape: 'lines', layers: 3, targetTiles: 48, timeLimit: 180 },
			{ shape: 'rings', layers: 3, targetTiles: 54, timeLimit: 200 },
			{ shape: 'lines', layers: 4, targetTiles: 64, timeLimit: 200 },
			{ shape: 'rings', layers: 4, targetTiles: 72, timeLimit: 220 },
			{ shape: 'shapes', layers: 4, targetTiles: 80, timeLimit: 240 },
			{ shape: 'shapes', layers: 5, targetTiles: 96, timeLimit: 280 },
			{ shape: 'shapes', layers: 5, targetTiles: 112, timeLimit: 300 },
			{ shape: 'shapes', layers: 5, targetTiles: 128, timeLimit: 360 }
		];

		/* ============================================================
		   GRID LIMITS
		   ============================================================ */
		var GRID_W = 20;
		var GRID_H = 12;
		var MAX_Z = 5;

		/* ============================================================
		   RNG — deterministic LCG
		   ============================================================ */
		function createRng(seed) {
			var s = seed >>> 0;
			return {
				next: function () {
					s = (s * 1664525 + 1013904223) >>> 0;
					return s / 4294967296;
				},
				reset: function () { s = seed >>> 0; }
			};
		}

		function shuffle(arr, rng) {
			for (var i = arr.length - 1; i > 0; i--) {
				var j = Math.floor(rng.next() * (i + 1));
				var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
			}
			return arr;
		}

		/* ============================================================
		   BOARD DATA MODEL
		   ============================================================ */
		function makeKey(z, x, y) { return z + ',' + x + ',' + y; }

		function buildBoard(layout) {
			var board = new Map();
			for (var i = 0; i < layout.length; i++) {
				var t = layout[i];
				t.removed = false;
				t.key = makeKey(t.z, t.x, t.y);
				board.set(t.key, t);
			}
			return board;
		}

		function hasTile(board, z, x, y) {
			if (z < 0 || x < 0 || y < 0 || z > MAX_Z || x > GRID_W || y > GRID_H) return false;
			var tile = board.get(makeKey(z, x, y));
			return !!tile && !tile.removed;
		}

		/* A tile is free (playable) when:
		   - nothing directly above it at (z+1, x, y) — first levels.
		     The full 3x3 "above" rule is introduced in Phase 3 with the
		     arcade difficulty progression, so early gameplay feels fair
		     and matches what is visually stacked.
		   - NOT (blocked on left AND blocked on right)
		   Blocked left  = any tile at (z, x-2, y±1)
		   Blocked right = any tile at (z, x+2, y±1)
		*/
		function isFree(board, tile) {
			if (tile.removed) return false;

			// Early levels: only the exact cell above counts.
			if (hasTile(board, tile.z + 1, tile.x, tile.y)) return false;

			var hasLeft = false;
			for (var dy = -1; dy <= 1; dy++) {
				if (hasTile(board, tile.z, tile.x - 2, tile.y + dy)) { hasLeft = true; break; }
			}

			var hasRight = false;
			for (var dy = -1; dy <= 1; dy++) {
				if (hasTile(board, tile.z, tile.x + 2, tile.y + dy)) { hasRight = true; break; }
			}

			return !(hasLeft && hasRight);
		}

		function getFreeTiles(board) {
			var free = [];
			board.forEach(function (tile) {
				if (!tile.removed && isFree(board, tile)) free.push(tile);
			});
			return free;
		}

		/* ============================================================
		   SHAPES (base layer generators)
		   ============================================================ */
		function shapeCross() {
			var pts = [];
			for (var i = -4; i <= 4; i++) {
				pts.push([9 + i * 2, 5]);
				pts.push([9, 5 + i]);
			}
			return pts;
		}

		function shapeLines() {
			var pts = [];
			for (var c = 0; c < 8; c++) {
				for (var r = 0; r < 4; r++) {
					pts.push([2 + c * 2, 2 + r * 2]);
				}
			}
			return pts;
		}

		function shapeRings() {
			var pts = [];
			for (var ring = 0; ring < 3; ring++) {
				var x0 = 3 - ring, y0 = 3 - ring, x1 = 15 + ring, y1 = 8 + ring;
				for (var x = x0; x <= x1; x += 2) {
					pts.push([x, y0]);
					pts.push([x, y1]);
				}
				for (var y = y0 + 1; y < y1; y++) {
					pts.push([x0, y]);
					pts.push([x1, y]);
				}
			}
			return pts;
		}

		function shapeShapes(rng) {
			var pts = [];
			var placed = new Set();
			for (var b = 0; b < 6; b++) {
				var bx = 2 + Math.floor(rng.next() * 10) * 2;
				var by = 2 + Math.floor(rng.next() * 6);
				for (var i = 0; i < 4; i++) {
					var dx = Math.floor(rng.next() * 3) * 2;
					var dy = Math.floor(rng.next() * 2);
					var x = bx + dx, y = by + dy;
					var key = x + ',' + y;
					if (!placed.has(key) && x >= 0 && x <= GRID_W && y >= 0 && y <= GRID_H) {
						placed.add(key);
						pts.push([x, y]);
					}
				}
			}
			return pts;
		}

		var SHAPE_FUNCS = {
			cross: function () { return shapeCross(); },
			lines: function () { return shapeLines(); },
			rings: function () { return shapeRings(); },
			shapes: function (rng) { return shapeShapes(rng); }
		};

		/* ============================================================
		   LAYOUT GENERATOR — base + upper layers
		   ============================================================ */
		function computeCandidates(layout, z, rng) {
			var minX = GRID_W, maxX = 0, minY = GRID_H, maxY = 0;
			var belowSet = new Set();
			for (var i = 0; i < layout.length; i++) {
				var t = layout[i];
				if (t.z !== z - 1) continue;
				if (t.x < minX) minX = t.x;
				if (t.x > maxX) maxX = t.x;
				if (t.y < minY) minY = t.y;
				if (t.y > maxY) maxY = t.y;
				belowSet.add(makeKey(t.z, t.x, t.y));
			}
			if (maxX < minX) return [];

			var taken = new Set();
			for (var j = 0; j < layout.length; j++) {
				if (layout[j].z === z) taken.add(makeKey(layout[j].z, layout[j].x, layout[j].y));
			}

			var candidates = [];
			for (var x = Math.max(0, minX - 1); x <= Math.min(GRID_W, maxX + 1); x++) {
				if (x % 2 !== 0) continue;
				for (var y = Math.max(0, minY - 1); y <= Math.min(GRID_H, maxY + 1); y++) {
					var key = makeKey(z, x, y);
					if (taken.has(key)) continue;
					var supported = false;
					for (var dx = -1; dx <= 1 && !supported; dx++) {
						for (var dy = -1; dy <= 1; dy++) {
							if (belowSet.has(makeKey(z - 1, x + dx, y + dy))) {
								supported = true;
								break;
							}
						}
					}
					if (supported) candidates.push({ x: x, y: y });
				}
			}
			return candidates;
		}

		function generateLayout(params, rng) {
			var shapeFn = SHAPE_FUNCS[params.shape] || SHAPE_FUNCS.cross;
			var basePts = shapeFn(rng);
			var baseCount = basePts.length - (basePts.length % 2);
			var layout = [];
			for (var i = 0; i < baseCount; i++) {
				layout.push({ z: 0, x: basePts[i][0], y: basePts[i][1] });
			}

			var z = 1;
			while (z < params.layers && layout.length < params.targetTiles) {
				var candidates = computeCandidates(layout, z, rng);
				shuffle(candidates, rng);

				var remaining = params.targetTiles - layout.length;
				var layersLeft = params.layers - z;
				var budget = Math.min(candidates.length, Math.max(2, Math.round(remaining / layersLeft)));
				var evenBudget = budget - (budget % 2);

				var placed = 0;
				for (var c = 0; c < candidates.length; c++) {
					if (placed >= evenBudget) break;
					if (layout.length + placed >= params.targetTiles) break;
					layout.push({ z: z, x: candidates[c].x, y: candidates[c].y });
					placed++;
				}
				z++;
			}

			if (layout.length % 2 !== 0) {
				layout.pop();
			}
			return layout;
		}

		/* ============================================================
		   TILE ASSIGNMENT
		   ============================================================ */
		var TILE_SYMBOLS = ['🀄','🍀','🌸','🔥','❄️','💎','⭐','🌙','☀️','🍃','💜','🔷','♠️','♥️','🍇','🎲'];

		function assignTiles(layout, rng) {
			var tileCount = layout.length;
			var groupCount = tileCount / 2;
			var deck = [];
			for (var g = 0; g < groupCount; g++) {
				deck.push({ groupId: g, symbol: TILE_SYMBOLS[g % TILE_SYMBOLS.length] });
				deck.push({ groupId: g, symbol: TILE_SYMBOLS[g % TILE_SYMBOLS.length] });
			}
			shuffle(deck, rng);

			var assigned = [];
			for (var i = 0; i < layout.length; i++) {
				var t = layout[i];
				var card = deck[i];
				assigned.push({
					z: t.z, x: t.x, y: t.y,
					value: card.groupId,
					groupId: card.groupId,
					symbol: card.symbol,
					removed: false
				});
			}
			return assigned;
		}

		/* ============================================================
		   SOLVER — DFS with heuristic (fewest free first)
		   ============================================================ */
		function solveBoard(board) {
			var tileList = Array.from(board.values());
			var removed = new Set();

			function isFreeForSolver(tile) {
				if (removed.has(tile.key)) return false;
				var zUp = tile.z + 1;
				for (var dx = -1; dx <= 1; dx++) {
					for (var dy = -1; dy <= 1; dy++) {
						var other = board.get(makeKey(zUp, tile.x + dx, tile.y + dy));
						if (other && !other.removed && !removed.has(other.key)) return false;
					}
				}
				var hasLeft = false;
				for (var dy = -1; dy <= 1; dy++) {
					var l = board.get(makeKey(tile.z, tile.x - 2, tile.y + dy));
					if (l && !l.removed && !removed.has(l.key)) { hasLeft = true; break; }
				}
				var hasRight = false;
				for (var dy = -1; dy <= 1; dy++) {
					var r = board.get(makeKey(tile.z, tile.x + 2, tile.y + dy));
					if (r && !r.removed && !removed.has(r.key)) { hasRight = true; break; }
				}
				return !(hasLeft && hasRight);
			}

			function getFree() {
				var free = [];
				for (var i = 0; i < tileList.length; i++) {
					var t = tileList[i];
					if (!removed.has(t.key) && isFreeForSolver(t)) free.push(t);
				}
				return free;
			}

			function rec() {
				if (removed.size === tileList.length) return true;

				var free = getFree();
				if (free.length === 0) return false;

				var byGroup = {};
				for (var i = 0; i < free.length; i++) {
					var gid = free[i].groupId;
					if (!byGroup[gid]) byGroup[gid] = [];
					byGroup[gid].push(free[i]);
				}

				var groupIds = Object.keys(byGroup).sort(function (a, b) {
					return byGroup[a].length - byGroup[b].length;
				});

				for (var g = 0; g < groupIds.length; g++) {
					var members = byGroup[groupIds[g]];
					for (var i2 = 0; i2 < members.length; i2++) {
						for (var j = i2 + 1; j < members.length; j++) {
							var a = members[i2], b = members[j];
							removed.add(a.key);
							removed.add(b.key);
							if (rec()) return true;
							removed.delete(a.key);
							removed.delete(b.key);
						}
					}
				}
				return false;
			}

			return rec();
		}

		/* ============================================================
		   LEVEL GENERATION — re-roll until solvable
		   ============================================================ */
		function generateSolvableLevel(levelIndex) {
			var params = LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
			var lastGood = null;

			for (var attempt = 0; attempt < 100; attempt++) {
				var seed = (Math.random() * 0xffffffff) >>> 0;
				var rng = createRng(seed);
				var layout = generateLayout(params, rng);
				if (layout.length < 4) continue;

				var tileList = assignTiles(layout, rng);
				var board = buildBoard(tileList);

				var free = getFreeTiles(board);
				var freeByGroup = {};
				var hasVisiblePair = false;
				for (var i = 0; i < free.length; i++) {
					var gid = free[i].groupId;
					freeByGroup[gid] = (freeByGroup[gid] || 0) + 1;
					if (freeByGroup[gid] >= 2) { hasVisiblePair = true; break; }
				}
				if (!hasVisiblePair) continue;

				if (solveBoard(board)) {
					return { board: board, params: params, seed: seed, layout: tileList };
				}
				lastGood = { board: board, params: params, seed: seed, layout: tileList };
			}

			if (lastGood) return lastGood;

			// Fallback: super-easy 12-tile cross
			var easyLayout = [];
			for (var i2 = -2; i2 <= 2; i2++) {
				easyLayout.push({ z: 0, x: 8 + i2 * 2, y: 5 });
				easyLayout.push({ z: 0, x: 8, y: 5 + i2 });
			}
			var easyTiles = assignTiles(easyLayout, createRng(42));
			var easyBoard = buildBoard(easyTiles);
			return { board: easyBoard, params: { shape: 'cross', layers: 1, targetTiles: 12, timeLimit: 120 }, seed: 42, layout: easyTiles };
		}

		/* ============================================================
		   RENDERING
		   ============================================================ */
		var TILE_W = 42, TILE_H = 48;
		// Grid geometry (Mahjong rule):
		// - two tiles at x and x+2 are horizontally adjacent (blockers at x±2):
		//   distance = 2 * STEP_X = 44px ≈ TILE_W (42px) -> small 2px gap.
		// - two tiles at y and y+1 are vertically adjacent one above the other:
		//   STEP_Y = 50 >= TILE_H so rows never overlap.
		// - each higher layer shifts tiles diagonally up-right:
		//   RISE = 20 makes the covering tile clearly overlap the one below,
		//   so a covered tile is obviously not playable.
		var STEP_X = 22, STEP_Y = 50, RISE = 20;

		function computeBoardMetrics(layout) {
			var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, maxZ = 0;
			for (var i = 0; i < layout.length; i++) {
				var t = layout[i];
				if (t.x < minX) minX = t.x;
				if (t.x > maxX) maxX = t.x;
				if (t.y < minY) minY = t.y;
				if (t.y > maxY) maxY = t.y;
				if (t.z > maxZ) maxZ = t.z;
			}
			return { minX: minX, maxX: maxX, minY: minY, maxY: maxY, maxZ: maxZ };
		}

		var boardEl = document.getElementById('board');
		var boardWrapEl = document.getElementById('board-wrap');
		var timerEl = document.getElementById('timer');
		var pairsLeftEl = document.getElementById('pairs-left');
		var scoreEl = document.getElementById('score');
		var overlayEl = document.getElementById('overlay');
		var modalEmoji = document.getElementById('modal-emoji');
		var modalTitle = document.getElementById('modal-title');
		var modalText = document.getElementById('modal-text');
		var modalBtn = document.getElementById('modal-btn');

		/* ============================================================
		   APP STATE
		   ============================================================ */
		var app = {
			levelIndex: 0,
			board: null,
			layout: [],
			selected: null,
			score: 0,
			elapsed: 0,
			timerInterval: null,
			timerStarted: false,
			history: [],
			hintsUsed: 0,
			undosUsed: 0,
			over: false
		};

		function totalPairs() {
			return app.layout.length / 2;
		}

		function pairsLeft() {
			var count = 0;
			for (var i = 0; i < app.layout.length; i++) {
				if (!app.layout[i].removed) count++;
			}
			return count / 2;
		}

		function renderBoard() {
			boardEl.innerHTML = '';
			var metrics = computeBoardMetrics(app.layout);

			var width = (metrics.maxX - metrics.minX) * STEP_X + TILE_W + 10;
			var height = (metrics.maxY - metrics.minY) * STEP_Y + metrics.maxZ * RISE + TILE_H + 10;
			boardEl.style.width = width + 'px';
			boardEl.style.height = height + 'px';

			for (var i = 0; i < app.layout.length; i++) {
				var t = app.layout[i];
				var el = document.createElement('div');
				el.className = 'tile';
				el.dataset.key = t.key;
				if (t.removed) {
					el.classList.add('removed');
					el.style.display = 'none';
				}
				el.style.left = ((t.x - metrics.minX) * STEP_X - t.z * 4) + 'px';
				el.style.top = ((t.y - metrics.minY) * STEP_Y - t.z * RISE) + 'px';
				el.style.zIndex = 10 + t.z * 10;
				el.textContent = t.symbol;
				el.addEventListener('click', (function (tile) {
					return function () { handleTileClick(tile); };
				})(t));
				boardEl.appendChild(el);
			}

			fitBoard(width, height);
			updateBoardClassNames();
		}

		function fitBoard(boardW, boardH) {
			var wrapW = boardWrapEl.clientWidth || window.innerWidth;
			var wrapH = boardWrapEl.clientHeight || window.innerHeight;
			var scale = Math.min(1, (wrapW - 8) / boardW, (wrapH - 8) / boardH);
			if (scale < 1) {
				boardEl.style.transform = 'scale(' + scale + ')';
			} else {
				boardEl.style.transform = '';
			}
		}

		function updateBoardClassNames() {
			var cells = boardEl.querySelectorAll('.tile');
			for (var i = 0; i < cells.length; i++) {
				var el = cells[i];
				var t = app.board.get(el.dataset.key);
				if (!t || t.removed) {
					el.classList.add('removed');
					el.style.display = 'none';
					continue;
				}
				el.style.display = 'flex';
				el.classList.remove('free', 'blocked', 'selected', 'match-hint');
				if (isFree(app.board, t)) {
					el.classList.add('free');
				} else {
					el.classList.add('blocked');
				}
				if (app.selected && app.selected.key === t.key) {
					el.classList.add('selected');
				}
				if (t.hinted) {
					el.classList.add('match-hint');
				}
			}
		}

		/* ============================================================
		   GAME ACTIONS
		   ============================================================ */
		function startTimer() {
			if (app.timerInterval) return;
			app.timerStarted = true;
			app.elapsed = 0;
			timerEl.textContent = '0';
			app.timerInterval = setInterval(function () {
				app.elapsed++;
				timerEl.textContent = app.elapsed;
			}, 1000);
		}

		function stopTimer() {
			if (app.timerInterval) {
				clearInterval(app.timerInterval);
				app.timerInterval = null;
			}
		}

		function handleTileClick(tile) {
			if (app.over) return;
			if (tile.removed) return;
			if (!isFree(app.board, tile)) {
				wiggle(tile);
				return;
			}

			if (!app.timerStarted) startTimer();

			if (app.selected) {
				if (app.selected.key === tile.key) {
					app.selected = null;
					updateBoardClassNames();
					return;
				}
				if (app.selected.groupId === tile.groupId) {
					match(app.selected, tile);
					return;
				}
				app.selected = null;
			}

			app.selected = tile;
			updateBoardClassNames();
		}

		function wiggle(tile) {
			var el = boardEl.querySelector('[data-key="' + tile.key + '"]');
			if (!el) return;
			el.style.transform = 'translateX(-4px)';
			setTimeout(function () { el.style.transform = 'translateX(4px)'; }, 60);
			setTimeout(function () { el.style.transform = ''; }, 120);
		}

		function match(a, b) {
			a.removed = true;
			b.removed = true;
			app.history.push([a, b]);
			app.selected = null;
			app.score += 100 + Math.max(0, 30 - app.elapsed) * 2;
			scoreEl.textContent = app.score;

			var pairCount = pairsLeft();
			pairsLeftEl.textContent = pairCount;

			updateBoardClassNames();

			if (pairCount === 0) {
				levelComplete();
			}
		}

		function undo() {
			if (app.history.length === 0) return;
			var pair = app.history.pop();
			pair[0].removed = false;
			pair[1].removed = false;
			app.selected = null;
			app.undosUsed++;
			pairsLeftEl.textContent = pairsLeft();
			updateBoardClassNames();
		}

		function hint() {
			if (app.over) return;
			clearHints();
			var free = getFreeTiles(app.board);
			if (free.length < 2) return;
			var byGroup = {};
			for (var i = 0; i < free.length; i++) {
				var gid = free[i].groupId;
				if (!byGroup[gid]) byGroup[gid] = [];
				byGroup[gid].push(free[i]);
			}
			var bestGroup = null;
			var bestCount = 0;
			for (var g in byGroup) {
				if (byGroup[g].length >= 2 && byGroup[g].length > bestCount) {
					bestGroup = byGroup[g];
					bestCount = byGroup[g].length;
				}
			}
			if (bestGroup) {
				bestGroup[0].hinted = true;
				bestGroup[1].hinted = true;
				app.hintsUsed++;
			}
			updateBoardClassNames();
			setTimeout(clearHints, 2000);
		}

		function clearHints() {
			for (var i = 0; i < app.layout.length; i++) {
				app.layout[i].hinted = false;
			}
		}

		/* ============================================================
		   LEVEL FLOW
		   ============================================================ */
		function startLevel(index) {
			app.levelIndex = index;
			app.selected = null;
			app.score = 0;
			app.elapsed = 0;
			app.history = [];
			app.hintsUsed = 0;
			app.undosUsed = 0;
			app.over = false;
			app.timerStarted = false;
			stopTimer();
			timerEl.textContent = '0';
			scoreEl.textContent = '0';
			overlayEl.classList.remove('show');
			clearHints();

			var result = generateSolvableLevel(index);
			app.board = result.board;
			app.layout = result.layout;
			pairsLeftEl.textContent = totalPairs();

			renderBoard();
		}

		function levelComplete() {
			app.over = true;
			stopTimer();

			var levelParams = LEVELS[Math.min(app.levelIndex, LEVELS.length - 1)];
			var bonus = Math.max(0, levelParams.timeLimit - app.elapsed) * 5;
			var finalScore = app.score + bonus;

			modalEmoji.textContent = '🎉';
			modalTitle.textContent = 'Level ' + (app.levelIndex + 1) + ' Complete!';
			modalText.textContent = 'Score: +' + finalScore + ' · Time: ' + app.elapsed + 's';

			var isLast = app.levelIndex >= LEVELS.length - 1;
			modalBtn.textContent = isLast ? '🔁 Restart' : '▶ Next Level';
			modalBtn.onclick = function () {
				if (isLast) {
					startLevel(0);
				} else {
					startLevel(app.levelIndex + 1);
				}
			};

			overlayEl.classList.add('show');
		}

		/* ============================================================
		   EVENT LISTENERS + INIT
		   ============================================================ */
		document.getElementById('btn-hint').addEventListener('click', hint);
		document.getElementById('btn-undo').addEventListener('click', undo);
		document.getElementById('btn-new').addEventListener('click', function () {
			startLevel(app.levelIndex);
		});

		window.addEventListener('resize', function () {
			if (!app.layout.length) return;
			var metrics = computeBoardMetrics(app.layout);
			var width = (metrics.maxX - metrics.minX) * STEP_X + TILE_W + 10;
			var height = (metrics.maxY - metrics.minY) * STEP_Y + metrics.maxZ * RISE + TILE_H + 10;
			fitBoard(width, height);
		});

		startLevel(0);
	})();
	</script>
</body>
</html>
