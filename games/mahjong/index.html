<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Mahjong Arcade</title>
	<style>
		:root {
			--bg: #0f172a;
			--bg-panel: #1e293b;
			--text: #e2e8f0;
			--accent: #38bdf8;
			--success: #22c55e;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			user-select: none;
			-webkit-user-select: none;
			touch-action: manipulation;
			-webkit-tap-highlight-color: transparent;
		}

		.game-container {
			display: flex;
			flex-direction: column;
			height: 100%;
			padding: 8px;
			gap: 8px;
		}

		.game-header { text-align: center; flex-shrink: 0; }

		.game-title {
			font-size: 1.3rem;
			font-weight: 800;
			background: linear-gradient(135deg, var(--accent), #f472b6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: -0.5px;
		}

		.status-bar {
			display: flex;
			justify-content: center;
			gap: 20px;
			background: var(--bg-panel);
			border-radius: 10px;
			padding: 6px 14px;
			flex-shrink: 0;
			font-family: 'Consolas', 'Courier New', monospace;
		}

		.status-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; font-weight: 700; }
		.status-value { color: var(--accent); min-width: 24px; text-align: center; }
		.status-value.pairs { color: var(--success); }

		/* ----------------------------------------------------------
		   STAGING BOX — 4 slots where clicked tiles are held.
		   Two matching tiles in the box automatically match.
		   4 tiles without a match = game over.
		   ---------------------------------------------------------- */
		.staging-box {
			display: flex;
			justify-content: center;
			gap: 8px;
			padding: 8px 14px;
			background: var(--bg-panel);
			border-radius: 10px;
			flex-shrink: 0;
			min-height: 60px;
			align-items: center;
		}

		.staging-slot {
			width: 38px;
			height: 48px;
			border: 2px dashed rgba(148, 163, 184, 0.35);
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			opacity: 0.5;
			position: relative;
		}

		.staging-slot.filled {
			border-style: solid;
			border-color: rgba(56, 189, 248, 0.5);
			background: linear-gradient(180deg, #f7f9fc 0%, #e9edf2 100%);
			box-shadow:
				1px 0 0 0 rgba(71, 85, 105, 0.30),
				0 3px 0 0 rgba(71, 85, 105, 0.25),
				1px 3px 0 0 rgba(71, 85, 105, 0.25),
				3px 5px 8px rgba(15, 23, 42, 0.25);
			opacity: 1;
		}

		.board-wrap {
			flex: 1;
			position: relative;
			overflow: hidden;
			min-height: 0;
			background: radial-gradient(circle at 50% 42%, #1e293b 0%, #0b1220 100%);
			border-radius: 14px;
		}

		#board {
			position: absolute;
			top: 0;
			left: 0;
			transform-origin: top left;
			touch-action: none;
		}

		/* ----------------------------------------------------------
		   TILE — every tile is pixel-identical. Rounded corners,
		   soft semi-transparent side faces, subtle gradient face,
		   uniform drop shadow (same blur on all sides: cannot
		   create the asymmetric edge illusion).
		   ---------------------------------------------------------- */
		.tile {
			position: absolute;
			top: 0;
			left: 0;
			width: 42px;
			height: 56px;
			border-radius: 4px;
			background: linear-gradient(180deg, #f7f9fc 0%, #e9edf2 100%);
			color: #1e293b;
			box-shadow:
				1px 0 0 0 rgba(71, 85, 105, 0.30),                /* right face (soft 3D)  */
				0 3px 0 0 rgb(28, 28, 28),                        /* bottom face (dark)    */
				1px 3px 0 0 rgba(71, 85, 105, 0.25),              /* bottom-right corner   */
				rgba(50, 50, 93, 0.25) 0px 50px 100px -20px,       /* deep ambient shadow   */
				rgba(0, 0, 0, 0.3) 0px 30px 60px -30px,            /* tight dark shadow     */
				rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;     /* face top inner edge   */
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 800;
			cursor: pointer;
			transition: transform 0.12s ease;
			transform: translate(var(--tx), var(--ty));
			will-change: transform;
		}

		.tile.z0 { z-index: 1; }
		.tile.z1 {
			z-index: 2;
			background: linear-gradient(180deg, #ffffff 0%, #f1f4f8 100%);
		}
		.tile.z2 { z-index: 3; background: linear-gradient(180deg, #ffffff 0%, #eef2f7 100%); }
		.tile.z3 { z-index: 4; background: linear-gradient(180deg, #fbfcff 0%, #e9eef5 100%); }
		.tile.z4 { z-index: 5; background: linear-gradient(180deg, #f8fafe 0%, #e4eaf2 100%); }
		.tile.z5 { z-index: 6; background: linear-gradient(180deg, #f5f8fd 0%, #e0e7f0 100%); }
		.tile.z6 { z-index: 7; }
		.tile.z7 { z-index: 8; }
		.tile.z8 { z-index: 9; }
		.tile.z9 { z-index: 10; }
		.status-value.level-value { color: #f472b6; font-weight: 800; }

		/* Face-down (covered) tiles — memory mechanic.
		   Symbol is HIDDEN: the sym element is invisible and the
		   tile shows a plain back. Always fully opaque, even when
		   blocked (no peeking through semi-transparency). */
		.tile.face-down {
			background: linear-gradient(135deg, #1e3a5f 0%, #0f2742 100%);
			color: #e2e8f0;
			opacity: 1;
		}
		.tile.face-down .tile-sym { visibility: hidden; }
		.tile.face-down::after {
			content: '?';
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			font-weight: 900;
			color: rgba(226, 232, 240, 0.45);
			pointer-events: none;
		}

		/* Blocked face-down tiles: cannot be dimmed (would reveal the
		   underlay through transparency), so use a red "lock" cue instead. */
		.tile.face-down.blocked {
			box-shadow:
				1px 0 0 0 rgba(71, 85, 105, 0.30),
				0 3px 0 0 rgba(71, 85, 105, 0.25),
				1px 3px 0 0 rgba(71, 85, 105, 0.25),
				0 0 0 2px rgba(239, 68, 68, 0.65) inset;
		}
		.tile.face-down.blocked::after {
			content: '🔒';
			font-size: 14px;
			color: rgba(239, 68, 68, 0.85);
		}
		.tile.face-down.blocked:hover .tile-overlay { opacity: 0; }
		.tile.face-down.blocked:hover { opacity: 1; }

		.tile:hover { transform: translate(var(--tx), var(--ty)) scale(1.05); }

		.tile-overlay {
			position: absolute;
			inset: 0;
			border-radius: 4px;
			opacity: 0;
			transition: opacity 0.12s ease;
			background: rgba(255, 255, 255, 0.55);
			box-shadow: 0 0 0 2px var(--accent) inset;
			pointer-events: none;
		}
		.tile:hover .tile-overlay { opacity: 1; }

		/* Blocked tiles: NO opacity — dimmed via darker face color
		   instead. Fully opaque, never shows tiles beneath. */
		.tile.blocked:not(.face-down) {
			opacity: 1;
			cursor: default;
			background: linear-gradient(180deg, #c9cfd7 0%, #aeb6bf 100%);
		}
		.tile.z1.blocked:not(.face-down) {
			background: linear-gradient(180deg, #e0e3e7 0%, #cdd1d6 100%);
		}
		.tile.blocked:hover { transform: translate(var(--tx), var(--ty)); }
		.tile.blocked:hover .tile-overlay { opacity: 0; }

		.tile.removed { visibility: hidden; pointer-events: none; }

		/* Tiles inside the staging box disappear from the board */
		.tile.in-staging { visibility: hidden; pointer-events: none; }

		.tile.selected { outline: 3px solid var(--accent); outline-offset: 2px; z-index: 3; }
		.tile.hinted { outline: 3px solid var(--success); outline-offset: 2px; z-index: 3; }

		/* Dragging (peek): lift over everything, no transition lag */
		.tile.dragging {
			z-index: 100;
			transition: none;
			touch-action: none;
			cursor: grabbing;
			transform: translate(var(--tx), var(--ty));
		}
		.tile.dragging .tile-overlay { opacity: 0; }

		.tile-sym { font-size: 20px; line-height: 1; }

		.plane-badge {
			position: absolute;
			top: 3px;
			left: 4px;
			font-size: 8px;
			font-weight: 900;
			line-height: 1;
			padding: 2px 4px;
			border-radius: 5px;
			color: #fff;
			background: #475569;
		}
		.plane-badge.p2 { background: #2563eb; }
		.plane-badge.half-badge { background: #9333ea; }

		.num-badge {
			position: absolute;
			top: 3px;
			right: 4px;
			font-size: 8px;
			font-weight: 900;
			line-height: 1;
			padding: 2px 4px;
			border-radius: 5px;
			color: #fff;
			background: rgba(30, 41, 59, 0.55);
		}

		.action-bar {
			display: flex;
			justify-content: center;
			gap: 10px;
			flex-shrink: 0;
		}

		.btn {
			padding: 8px 20px;
			border-radius: 999px;
			border: none;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
			font-family: inherit;
			background: var(--bg-panel);
			color: var(--text);
		}
		.btn:hover { background: #3b4c66; }
		.btn:active { transform: scale(0.96); }

		.btn-level-input {
			width: 56px;
			padding: 8px 6px;
			border-radius: 999px;
			border: 1px solid #334155;
			background: #0f172a;
			color: var(--text);
			font-size: 0.9rem;
			font-weight: 700;
			text-align: center;
			font-family: inherit;
		}
		.btn-level-input:focus { outline: 2px solid var(--accent); }

		.overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.7);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}
		.overlay.show { display: flex; }

		.modal {
			background: var(--bg-panel);
			padding: 24px 40px;
			border-radius: 16px;
			text-align: center;
			display: flex;
			flex-direction: column;
			gap: 12px;
			align-items: center;
		}
		.modal h2 { font-size: 1.6rem; }
		.modal p { color: #94a3b8; font-weight: 600; }

		/* ----------------------------------------------------------
		   MOBILE — maximise board space on small screens
		   ---------------------------------------------------------- */
		@media (max-width: 480px) {
			.game-container { padding: 4px; gap: 4px; }
			.status-bar { padding: 4px 10px; gap: 12px; }
			.staging-box { padding: 4px 8px; gap: 6px; min-height: 50px; }
			.staging-slot { width: 32px; height: 42px; font-size: 16px; }
			.btn { padding: 6px 14px; font-size: 0.8rem; }
			.game-title { font-size: 1.1rem; }
			.status-item { font-size: 0.8rem; }
			.tile-sym { font-size: 18px; }
			.board-wrap { border-radius: 10px; }
		}
	</style>
</head>
<body>
	<div class="game-container">
		<div class="game-header">
			<h1 class="game-title">🀄 Mahjong Arcade</h1>
		</div>

		<div class="status-bar">
			<div class="status-item">🎯 <span class="status-value level-value" id="level-label">1</span></div>
			<div class="status-item">⏱️ <span class="status-value" id="timer">0</span></div>
			<div class="status-item">🀄 <span class="status-value pairs" id="pairs-left">0</span></div>
			<div class="status-item">🏆 <span class="status-value" id="score">0</span></div>
		</div>

		<div class="staging-box" id="staging-box"></div>

		<div class="board-wrap" id="board-wrap">
			<div id="board"></div>
		</div>

		<div class="action-bar">
			<button class="btn" id="btn-hint">💡 Hint</button>
			<button class="btn" id="btn-undo">↩️ Undo</button>
			<button class="btn" id="btn-new">🔄 New</button>
			<input type="number" id="level-input" class="btn-level-input" min="1" max="100" value="1" aria-label="Level number">
			<button class="btn" id="btn-level-go">Level</button>
		</div>
	</div>

	<div class="overlay" id="overlay">
		<div class="modal">
			<h2 id="modal-title">🏆 Cleared!</h2>
			<p id="modal-stats"></p>
			<button class="btn" id="btn-play-again">🔄 Play again</button>
		</div>
	</div>

	<script>
	(function () {
		'use strict';

		/* ============================================================
		   CONSTANTS
		   ============================================================ */
		var MAX_STAGING = 4;           // staging box capacity
		var FACE_DOWN_PAIRS = 1;       // how many pairs start covered (memory)

		/* ============================================================
		   SYMBOLS + RNG
		   ============================================================ */
		var SYMBOLS = ['🀄', '🍀', '🌸', '🔥', '❄️', '💎', '⭐', '🌙', '☀️', '🍃', '💜', '🔷', '🍄', '🎈', '🌈', '🍕', '⚽', '🎲'];

		function createRng(seed) {
			var s = seed >>> 0;
			return {
				next: function () {
					s = (s * 1664525 + 1013904223) >>> 0;
					return s / 4294967296;
				}
			};
		}

		function shuffle(arr, rng) {
			for (var i = arr.length - 1; i > 0; i--) {
				var j = Math.floor(rng.next() * (i + 1));
				var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
			}
			return arr;
		}

		/* ============================================================
		   THEMED SYMBOL SETS — emoji groups by palette. Each set has
		   22+ symbols so every layout (up to 144 tiles / 72 pairs)
		   has enough distinct faces.
		   ============================================================ */
		var SYMBOL_SETS = {
			'default': ['🀄', '🍀', '🌸', '🔥', '❄️', '💎', '⭐', '🌙', '☀️', '🍃', '💜', '🔷', '🍄', '🎈', '🌈', '🍕', '⚽', '🎲', '🐍', '🦋', '🌵', '🍇'],
			'red':     ['🍎', '🌹', '❤️', '🍒', '🦞', '🔴', '🐞', '🎒', '🍉', '🐙', '🧣', '🍅', '🌶️', '🎈', '🩸', '🧲', '💄', '🍓', '🧧', '🦀', '🍁', '🛑'],
			'green':   ['🌿', '🦎', '💚', '🍏', '🦠', '🫑', '🐸', '🐢', '🥑', '🐲', '🌲', '🍀', '🧪', '🍐', '🦜', '🥦', '🐍', '🥒', '🌵', '🌱', '🦗', '🍈'],
			'blue':    ['🐟', '🌊', '💙', '🧢', '🦋', '🐳', '🔵', '🫐', '🧊', '🐬', '💧', '☂️', '🧤', '⚓', '🦈', '🥶', '💠', '🔷', '🌧️', '⛵', '🐧', '🧿'],
			'gold':    ['⭐', '👑', '🏆', '🔔', '💛', '🪙', '🍯', '🐝', '🌻', '⚜️', '🌟', '🤴', '👸', '💰', '🥇', '✨', '🔶', '🍋', '🦁', '🍞', '🌽', '🟡'],
			'dark':    ['🕷️', '🦇', '🌑', '🖤', '🐈', '🧛', '🕯️', '💀', '🪦', '🌘', '🦉', '⚫', '🌃', '🐉', '🔮', '🌫️', '🦂', '🥷', '🕸️', '😈', '🍆', '🦇']
		};

		/* ============================================================
		   CLASSIC LAYOUTS — deterministic geometric patterns built
		   from aligned rectangles / paths. All tiles are FULL tiles
		   stacked straight above each other (same x, same y, z grows),
		   so every upper plane sits perfectly aligned on the one below.
		   Max 6 tiles wide → mobile friendly.

		   Variants (small / medium / large) were benchmarked with the
		   solver: only variants with a healthy solvable-shuffle rate are
		   included. The order of play comes from ORDERED_STEPS below,
		   computed by the solver, NOT from the shape.
		   ============================================================ */
		function evenTrim(pts) {
			if (pts.length % 2 !== 0) return pts.slice(0, pts.length - 1);
			return pts;
		}

		var LAYOUT_BUILDERS = {
			'halfcover': {
				'small': function () {
					var pts = [];
					for (var y = 0; y < 3; y++) {
						for (var x = 0; x < 3; x++) pts.push({ z: 0, x: x * 2, y: y });
					}
					for (var hy = 1; hy < 3; hy++) {
						for (var hx = 1; hx < 4; hx += 2) {
							pts.push({ z: 1, x: hx, y: hy, isHalf: true });
						}
					}
					return evenTrim(pts); // 9+4=13 → 12
				},
				'medium': function () {
					var pts = [];
					for (var y = 0; y < 4; y++) {
						for (var x = 0; x < 4; x++) pts.push({ z: 0, x: x * 2, y: y });
					}
					for (var hy = 1; hy < 4; hy++) {
						for (var hx = 1; hx < 6; hx += 2) {
							pts.push({ z: 1, x: hx, y: hy, isHalf: true });
						}
					}
					pts.push({ z: 0, x: 2, y: 5 });
					return pts; // 26
				}
			},

			'cross': {
				'small': function () {
					var pts = [];
					for (var y = 0; y < 5; y++) {
						for (var x = 0; x < 5; x++) {
							if (x === 2 || y === 2) pts.push({ z: 0, x: x * 2, y: y });
						}
					}
					pts.push({ z: 1, x: 2, y: 2 }, { z: 1, x: 4, y: 2 }, { z: 1, x: 2, y: 3 });
					pts.push({ z: 2, x: 4, y: 2 }, { z: 2, x: 2, y: 3 });
					return pts; // 14
				},
				'medium': function () {
					var pts = [];
					for (var y = 0; y < 5; y++) {
						for (var x = 0; x < 5; x++) {
							if (Math.abs(y - 2) <= 1 || Math.abs(x - 2) <= 1) pts.push({ z: 0, x: x * 2, y: y });
						}
					}
					for (var y2 = 1; y2 < 4; y2++) {
						for (var x2 = 1; x2 < 4; x2++) pts.push({ z: 1, x: x2 * 2, y: y2 });
					}
					pts.push({ z: 2, x: 4, y: 2 }, { z: 2, x: 4, y: 3 });
					return pts; // 32
				},
				'large': function () {
					var pts = [];
					for (var y = 0; y < 5; y++) {
						for (var x = 0; x < 5; x++) {
							if (Math.abs(y - 2) <= 1 || Math.abs(x - 2) <= 1) pts.push({ z: 0, x: x * 2, y: y });
						}
					}
					for (var y2 = 0; y2 < 4; y2++) {
						for (var x2 = 0; x2 < 4; x2++) pts.push({ z: 1, x: x2 * 2 + 2, y: y2 + 1 });
					}
					for (var y3 = 0; y3 < 2; y3++) {
						for (var x3 = 0; x3 < 2; x3++) pts.push({ z: 2, x: x3 * 2 + 4, y: y3 + 2 });
					}
					pts.push({ z: 3, x: 6, y: 3 });
					return pts; // 42
				}
			},

			'pyramid': {
				'small': function () {
					var pts = [];
					var layers = [[3, 3], [2, 2], [1, 1]];
					for (var z = 0; z < layers.length; z++) {
						var w = layers[z][0], h = layers[z][1];
						var ox = Math.round((3 - w) / 2), oy = Math.round((3 - h) / 2);
						for (var y = 0; y < h; y++) {
							for (var x = 0; x < w; x++) pts.push({ z: z, x: (x + ox) * 2, y: y + oy });
						}
					}
					return pts; // 14
				},
				'medium': function () {
					var pts = [];
					var layers = [[4, 4], [3, 3], [2, 2], [1, 1]];
					for (var z = 0; z < layers.length; z++) {
						var w = layers[z][0], h = layers[z][1];
						var ox = Math.round((4 - w) / 2), oy = Math.round((4 - h) / 2);
						for (var y = 0; y < h; y++) {
							for (var x = 0; x < w; x++) pts.push({ z: z, x: (x + ox) * 2, y: y + oy });
						}
					}
					return pts; // 30
				},
				'large': function () {
					var pts = [];
					var layers = [[5, 5], [4, 4], [3, 3], [2, 2], [2, 1]];
					for (var z = 0; z < layers.length; z++) {
						var w = layers[z][0], h = layers[z][1];
						var ox = Math.round((5 - w) / 2), oy = Math.round((5 - h) / 2);
						for (var y = 0; y < h; y++) {
							for (var x = 0; x < w; x++) pts.push({ z: z, x: (x + ox) * 2, y: y + oy });
						}
					}
					return pts; // 56
				}
			},

			'fortress': {
				'small': function () {
					var pts = [];

			});

			for (var k = 0; k < order.length; k++) {
				var idx = order[k];
				var t = app.tiles[idx];
				var el = createTileEl(t, idx);
				var pos = layoutPos(t, app._metrics);
				el.style.setProperty('--tx', pos.x + 'px');
				el.style.setProperty('--ty', pos.y + 'px');
				boardEl.appendChild(el);
				app.tileEls[idx] = el;
			}
			updateStates();
			fitBoard();
		}

		function updateStates() {
			for (var i = 0; i < app.tiles.length; i++) {
				var t = app.tiles[i];
				var el = app.tileEls[i];
				if (!el) continue;
				el.classList.toggle('removed', t.removed);
				el.classList.toggle('in-staging', t.staging && !t.removed);
				el.classList.toggle('blocked', !t.removed && !t.staging && !isFree(app.board, t));
				el.classList.toggle('face-down', t.faceDown && !t.staging && !t.removed);
				el.classList.toggle('hinted', !!t.hinted);
				if (el._symEl) {
					el._symEl.textContent = t.faceDown ? '🀄' : t.symbol;
				}
			}
		}

		/* ============================================================
		   FITTING — scale the whole board, never individual tiles.
		   ============================================================ */
		function fitBoard() {
			var size = app._boardSize;
			var wrapW = wrap.clientWidth || window.innerWidth;
			var wrapH = wrap.clientHeight || window.innerHeight;
			var s = Math.min((wrapW - 4) / size.w, (wrapH - 4) / size.h);
			app._scale = s;

			boardEl.style.width = size.w + 'px';
			boardEl.style.height = size.h + 'px';
			boardEl.style.transform = 'scale(' + s + ')';
			boardEl.style.left = Math.round((wrapW - size.w * s) / 2) + 'px';
			boardEl.style.top = Math.round((wrapH - size.h * s) / 2) + 'px';
		}

		/* ============================================================
		   APP STATE + GAME FLOW
		   ============================================================ */
		var app = {
			tiles: [],
			board: null,
			staging: [],          // tiles in the staging box (max 4)
			peeking: null,        // face-down tile currently revealed
			tileEls: [],
			score: 0,
			elapsed: 0,
			timerInterval: null,
			timerStarted: false,
			history: [],
			levelIndex: 0,
			_metrics: null,
			_boardSize: null,
			_scale: 1,
			autoMatching: false
		};

		function pairsLeft() {
			var count = 0;
			app.tiles.forEach(function (t) { if (!t.removed) count++; });
			return count / 2;
		}

		function startTimer() {
			if (app.timerInterval) return;
			app.timerStarted = true;
			app.timerInterval = setInterval(function () {
				app.elapsed++;
				timerEl.textContent = app.elapsed;
			}, 1000);
		}

		function stopTimer() {
			if (app.timerInterval) { clearInterval(app.timerInterval); app.timerInterval = null; }
		}

		/* ============================================================
		   STAGING BOX — click a free tile to send it here.
		   Two same symbols → auto-match. 4 without match → game over.
		   ============================================================ */
		function renderStaging() {
			stagingBoxEl.innerHTML = '';
			for (var i = 0; i < MAX_STAGING; i++) {
				var slot = document.createElement('div');
				slot.className = 'staging-slot';
				if (i < app.staging.length) {
					slot.classList.add('filled');
					slot.textContent = app.staging[i].symbol;
				}
				stagingBoxEl.appendChild(slot);
			}
		}

		function moveToStaging(tile) {
			if (app.staging.length >= MAX_STAGING) return;
			if (tile.staging || tile.removed) return;

			/* Flight animation: capture source position & make a clone
			   while the tile is still visible on the board. */
			var srcEl = app.tileEls[app.tiles.indexOf(tile)];
			var srcRect = null;
			var flyer = null;
			if (srcEl) {
				srcRect = srcEl.getBoundingClientRect();
				flyer = srcEl.cloneNode(true);
				flyer.classList.remove('dragging', 'in-staging', 'removed', 'blocked', 'selected', 'hinted');
				flyer.style.cssText =
					'position:fixed;margin:0;z-index:500;pointer-events:none;will-change:transform;' +
					'transition:transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1), opacity 250ms ease;' +
					'left:' + srcRect.left + 'px;top:' + srcRect.top + 'px;' +
					'width:' + srcRect.width + 'px;height:' + srcRect.height + 'px;';
			}

			var pendingSlotIdx = app.staging.length;

			app.staging.push(tile);
			tile.staging = true;
			tile.faceDown = false;

			/* Auto-match: check if same symbol already in the box */
			var matched = false;
			for (var i = 0; i < app.staging.length - 1; i++) {
				var prev = app.staging[i];
				if (prev.symbol === tile.symbol && prev !== tile) {
					prev.staging = false;
					tile.staging = false;
					prev.removed = true;
					tile.removed = true;
					app.staging = app.staging.filter(function (t) {
						return t !== prev && t !== tile;
					});
					app.history.push([prev, tile]);
					app.score += 100;
					scoreEl.textContent = app.score;
					matched = true;
					break;
				}
			}

			pairsLeftEl.textContent = pairsLeft();
			updateStates();
			renderStaging();

			/* Launch the flying clone towards its slot */
			if (flyer) {
				var slot = stagingBoxEl.children[Math.min(pendingSlotIdx, MAX_STAGING - 1)] || stagingBoxEl;
				var dstRect = slot.getBoundingClientRect();
				var dx = dstRect.left - srcRect.left + (dstRect.width - srcRect.width) / 2;
				var dy = dstRect.top - srcRect.top + (dstRect.height - srcRect.height) / 2;
				var s = Math.max(0.1, Math.min(1,
					dstRect.width / srcRect.width,
					dstRect.height / srcRect.height
				));
				document.body.appendChild(flyer);
				flyer.offsetWidth; /* force reflow to start the transition */
				flyer.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
				if (matched) flyer.style.opacity = '0';
				setTimeout(function () { flyer.remove(); }, 350);
			}

			/* Game over: 4 tiles in the box without any match */
			if (!matched && app.staging.length >= MAX_STAGING) {
				stopTimer();
				modalTitle.textContent = '💀 Staging Full!';
				modalStats.textContent = '4 tiles, no match — try again!';
				overlayEl.classList.add('show');
				return;
			}

			if (pairsLeft() === 0) levelComplete();
		}

		/* ============================================================
		   CLICK / TAP LOGIC
		   face-down: 1st click reveals, 2nd click sends to staging.
		   face-up: 1st click sends to staging.
		   If a revealed tile matches one already in staging →
		   auto-match without an extra click.
		   ============================================================ */
		function handleTileClick(tile) {
			if (app.autoMatching) return;
			if (tile.removed || tile.staging) return;
			if (!isFree(app.board, tile)) {
				app.peeking = null;
				updateStates();
				return;
			}
			if (!app.timerStarted) startTimer();

			/* Case 1: covered tile → reveal (cover previous peeked) */
			if (tile.faceDown) {
				/* If the previously revealed tile matches this one →
				   BOTH go to staging immediately (auto-match, saves
				   an extra click on the first tile). */
				if (app.peeking && app.peeking.key !== tile.key &&
				    app.peeking.symbol === tile.symbol) {
					var first = app.peeking;
					app.peeking = null;
					tile.faceDown = false;
					updateStates();
					app.autoMatching = true;
					setTimeout(function () {
						app.autoMatching = false;
						moveToStaging(first);
						moveToStaging(tile);
					}, 250);
					return;
				}

				if (app.peeking && app.peeking.key !== tile.key) {
					app.peeking.faceDown = true;
				}
				tile.faceDown = false;
				app.peeking = tile;

				/* If its match is already in staging → auto-match */
				for (var i = 0; i < app.staging.length; i++) {
					if (app.staging[i].symbol === tile.symbol) {
						app.peeking = null;
						moveToStaging(tile);
						return;
					}
				}

				updateStates();
				return;
			}

			/* Case 2: click on the currently peeked tile → staging */
			if (app.peeking && app.peeking.key === tile.key) {
				app.peeking = null;
				moveToStaging(tile);
				return;
			}

			/* Case 3: face-up tile → staging (any peeking tile re-covers) */
			if (app.peeking) {
				app.peeking.faceDown = true;
				app.peeking = null;
			}
			moveToStaging(tile);
		}

		function match() {
			/* Kept for downstream compat — matches are automatic in staging. */
		}

		function undo() {
			if (app.history.length === 0) return;
			var pair = app.history.pop();
			pair[0].removed = false;
			pair[1].removed = false;
			pair[0].faceDown = false;
			pair[1].faceDown = false;
			pair[0].staging = false;
			pair[1].staging = false;
			updateStates();
			renderStaging();
			pairsLeftEl.textContent = pairsLeft();
		}

		function hint() {
			var free = [];
			app.board.forEach(function (t) {
				if (!t.removed && !t.staging && isFree(app.board, t)) free.push(t);
			});
			var bySymbol = {};
			free.forEach(function (t) {
				(bySymbol[t.symbol] = bySymbol[t.symbol] || []).push(t);
			});
			for (var sym in bySymbol) {
				if (bySymbol[sym].length >= 2) {
					bySymbol[sym][0].hinted = true;
					bySymbol[sym][1].hinted = true;
					updateStates();
					setTimeout(function () {
						bySymbol[sym][0].hinted = false;
						bySymbol[sym][1].hinted = false;
						updateStates();
					}, 2000);
					return;
				}
			}
		}

		function levelComplete() {
			stopTimer();
			app.levelIndex = Math.min(app.levelIndex + 1, 99);
			saveGame();
			modalTitle.textContent = '🏆 Level ' + (app.levelIndex + 1) + ' Cleared!';
			modalStats.textContent = 'Time: ' + app.elapsed + 's   ·   Score: ' + app.score;
			overlayEl.classList.add('show');
		}

		function startGame() {
			stopTimer();
			app.tiles = generateLevel(app.levelIndex);
			app.board = buildBoard(app.tiles);
			app.staging = [];
			app.peeking = null;
			app.tileEls = [];
			app.score = 0;
			app.elapsed = 0;
			app.history = [];
			app.timerStarted = false;

			app._metrics = computeMetrics(app.tiles);
			app._boardSize = boardSize(app._metrics);

			levelLabelEl.textContent = app.levelIndex + 1;
			timerEl.textContent = '0';
			scoreEl.textContent = '0';
			pairsLeftEl.textContent = pairsLeft();
			overlayEl.classList.remove('show');
			renderStaging();
			rebuildBoard();
		}

		/* ============================================================
		   ARCADE PERSISTENCE — level reached + debug URL ?level=N.
		   ============================================================ */
		function readUrlParams() {
			try {
				var qs = new URLSearchParams(window.location.search);
				var lvl = parseInt(qs.get('level'), 10);
				if (!isNaN(lvl) && lvl >= 1) app.levelIndex = Math.min(lvl - 1, 99);
			} catch (e) {}
		}

		function saveGame() {
			try {
				localStorage.setItem('wp_mahjong_arcade_level', String(app.levelIndex));
			} catch (e) {}
		}

		function loadGame() {
			try {
				var raw = localStorage.getItem('wp_mahjong_arcade_level');
				if (raw !== null) {
					var n = parseInt(raw, 10);
					if (!isNaN(n) && n >= 0) app.levelIndex = Math.min(n, 99);
				}
			} catch (e) {}
		}

		readUrlParams();
		if (!new URLSearchParams(window.location.search).get('level')) loadGame();
		window.addEventListener('beforeunload', saveGame);

		/* ============================================================
		   DRAG TO PEEK — pointer events cover mouse + touch.
		   Tiles can be lifted and moved; on release they snap back.
		   Movement < 5px is treated as a normal click.
		   ============================================================ */
		var drag = {
			active: false,
			el: null,
			tile: null,
			startX: 0,
			startY: 0,
			baseX: 0,
			baseY: 0,
			moved: false
		};

		function tileFromEvent(e) {
			var el = e.target.closest('.tile');
			if (!el) return null;
			var idx = parseInt(el.dataset.index, 10);
			var tile = app.tiles[idx];
			if (!tile || tile.removed || tile.staging) return null;
			return { el: el, tile: tile };
		}

		boardEl.addEventListener('pointerdown', function (e) {
			if (app.autoMatching) return;
			var hit = tileFromEvent(e);
			if (!hit) {
				app.peeking = null;
				updateStates();
				return;
			}
			if (!isFree(app.board, hit.tile)) return;

			drag.active = true;
			drag.el = hit.el;
			drag.tile = hit.tile;
			drag.startX = e.clientX;
			drag.startY = e.clientY;
			drag.baseX = parseInt(hit.el.style.getPropertyValue('--tx'), 10);
			drag.baseY = parseInt(hit.el.style.getPropertyValue('--ty'), 10);
			drag.moved = false;
			hit.el.classList.add('dragging');
			try { hit.el.setPointerCapture(e.pointerId); } catch (err) {}
		});

		boardEl.addEventListener('pointermove', function (e) {
			if (!drag.active) return;
			var dx = e.clientX - drag.startX;
			var dy = e.clientY - drag.startY;
			if (Math.abs(dx) > 4 || Math.abs(dy) > 4) drag.moved = true;
			if (!drag.moved) return;
			/* Divide by scale: the board is scaled via transform:scale(),
			   so screen pixels ≠ board-local pixels. */
			var s = app._scale || 1;
			drag.el.style.setProperty('--tx', (drag.baseX + dx / s) + 'px');
			drag.el.style.setProperty('--ty', (drag.baseY + dy / s) + 'px');
		});

		function endDrag() {
			if (!drag.active) return;
			var el = drag.el;
			var tile = drag.tile;
			var wasClick = !drag.moved;

			drag.active = false;
			drag.el = null;
			drag.tile = null;

			/* Snap back with animation */
			el.classList.remove('dragging');
			el.style.setProperty('--tx', drag.baseX + 'px');
			el.style.setProperty('--ty', drag.baseY + 'px');

			if (wasClick) handleTileClick(tile);
		}

		boardEl.addEventListener('pointerup', endDrag);
		boardEl.addEventListener('pointercancel', endDrag);

		document.getElementById('btn-hint').addEventListener('click', hint);
		document.getElementById('btn-undo').addEventListener('click', undo);
		document.getElementById('btn-new').addEventListener('click', startGame);
		document.getElementById('btn-play-again').addEventListener('click', startGame);

		/* Level selector: jump to any level */
		document.getElementById('btn-level-go').addEventListener('click', function () {
			var n = parseInt(document.getElementById('level-input').value, 10);
			if (isNaN(n) || n < 1) n = 1;
			app.levelIndex = Math.min(n - 1, 99);
			saveGame();
			startGame();
		});

		window.addEventListener('resize', function () {
			if (app.tiles.length) fitBoard();
		});

		startGame();
	})();
	</script>
</body>
</html>
