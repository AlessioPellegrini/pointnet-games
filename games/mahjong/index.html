<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Mahjong Arcade</title>
	<style>
		:root {
			--bg: #0f172a;
			--bg-panel: #1e293b;
			--text: #e2e8f0;
			--text-dim: #94a3b8;
			--accent: #38bdf8;
			--success: #22c55e;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		html, body {
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			user-select: none;
			-webkit-user-select: none;
			touch-action: manipulation;
		}

		.game-container {
			display: flex;
			flex-direction: column;
			height: 100%;
			padding: 8px;
			gap: 8px;
		}

		.game-header { text-align: center; flex-shrink: 0; }

		.game-title {
			font-size: 1.3rem;
			font-weight: 800;
			background: linear-gradient(135deg, var(--accent), #f472b6);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			letter-spacing: -0.5px;
		}

		.status-bar {
			display: flex;
			justify-content: center;
			gap: 20px;
			background: var(--bg-panel);
			border-radius: 10px;
			padding: 6px 14px;
			flex-shrink: 0;
			font-family: 'Consolas', 'Courier New', monospace;
		}

		.status-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; font-weight: 700; }
		.status-value { color: var(--accent); min-width: 24px; text-align: center; }
		.status-value.pairs { color: var(--success); }

		.board-wrap {
			flex: 1;
			position: relative;
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 0;
		}

		#board { position: relative; transform-origin: top left; }

		.tile {
			position: absolute;
			width: 42px;
			height: 48px;
			background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 70%, #cbd5e1 100%);
			border: 1px solid #94a3b8;
			border-radius: 6px;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 22px;
			box-shadow: 2px 2px 0 #94a3b8, 4px 4px 0 #64748b, 5px 5px 6px rgba(0,0,0,0.35);
			color: #1e293b;
			cursor: pointer;
			transition: transform 0.08s ease, box-shadow 0.15s ease, filter 0.15s ease;
		}

		.tile.free { pointer-events: auto; }
		.tile.blocked {
			pointer-events: none;
			filter: brightness(0.75) saturate(0.5);
			/* No box-shadow override: every tile keeps the same 3D
			   thickness, free or blocked — the only difference is dimming. */
		}
		.tile.selected {
			transform: translateY(-6px) scale(1.08);
			box-shadow: 0 8px 16px rgba(56, 189, 248, 0.5), 0 0 0 3px var(--accent);
			z-index: 200 !important;
		}
		.tile.match-hint { box-shadow: 0 0 0 3px var(--success); }
		.tile.removed { display: none; }

		.action-bar {
			display: flex;
			justify-content: center;
			gap: 10px;
			flex-shrink: 0;
		}

		.btn {
			padding: 8px 20px;
			border-radius: 999px;
			border: none;
			font-size: 0.9rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.2s ease;
			font-family: inherit;
			background: var(--bg-panel);
			color: var(--text);
		}
		.btn:hover { background: #3b4c66; }
		.btn:active { transform: scale(0.96); }
	</style>
</head>
<body>
	<div class="game-container">
		<div class="game-header">
			<h1 class="game-title">🀄 Mahjong Arcade</h1>
		</div>

		<div class="status-bar">
			<div class="status-item">⏱️ <span class="status-value" id="timer">0</span></div>
			<div class="status-item">🀄 <span class="status-value pairs" id="pairs-left">0</span></div>
			<div class="status-item">🏆 <span class="status-value" id="score">0</span></div>
		</div>

		<div class="board-wrap" id="board-wrap">
			<div id="board"></div>
		</div>

		<div class="action-bar">
			<button class="btn" id="btn-hint">💡 Hint</button>
			<button class="btn" id="btn-undo">↩️ Undo</button>
			<button class="btn" id="btn-new">🔄 New</button>
		</div>
	</div>

	<script>
	(function () {
		'use strict';

		/* ============================================================
		   STATIC TEST LAYOUT — 2 aligned planes (no generator yet).
		   Planes are perfectly stacked: upper tiles sit EXACTLY above
		   lower tiles at the same (x,y), so nothing hangs in the air.
		   ============================================================ */

		// Symbols, one per pair (24 tiles = 12 pairs)
		var SYMBOLS = ['🀄','🍀','🌸','🔥','❄️','💎','⭐','🌙','☀️','🍃','💜','🔷'];

		// Deterministic RNG (LCG)
		function createRng(seed) {
			var s = seed >>> 0;
			return {
				next: function () {
					s = (s * 1664525 + 1013904223) >>> 0;
					return s / 4294967296;
				}
			};
		}

		function shuffle(arr, rng) {
			for (var i = arr.length - 1; i > 0; i--) {
				var j = Math.floor(rng.next() * (i + 1));
				var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
			}
			return arr;
		}

		// ---- Plane 0 (base) - 4x4 even-step grid: 16 tiles
		var BASE_COORDS = [
			[0,0],[2,0],[4,0],[6,0],
			[0,1],[2,1],[4,1],[6,1],
			[0,2],[2,2],[4,2],[6,2],
			[0,3],[2,3],[4,3],[6,3]
		];

		// ---- Plane 1 (upper) - 8 tiles, aligned subset of the centre
		var UPPER_COORDS = [
			[2,1],[4,1],
			[2,2],[4,2],
			[2,3],[4,3],
			[2,0],[4,0]
		];

		// Builds a layout with a shuffled pair deck and verifies it is
		// solvable via DFS; re-rolls until a solvable layout is found.
		function buildStaticLayout() {
			var allCoords = BASE_COORDS.concat(UPPER_COORDS);
			var lastBest = null;

			for (var attempt = 0; attempt < 100; attempt++) {
				var rng = createRng(42 + attempt);
				var deck = [];
				for (var i = 0; i < SYMBOLS.length; i++) {
					deck.push(SYMBOLS[i]);
					deck.push(SYMBOLS[i]);
				}
				shuffle(deck, rng);

				var tiles = [];
				for (var c = 0; c < allCoords.length; c++) {
					var coord = allCoords[c];
					var z = coord[0] < 0 ? 1 : 0; // never used; coords are all plain
					// allCoords is BASE (z=0) then UPPER (z=1)
					z = c < BASE_COORDS.length ? 0 : 1;
					tiles.push({
						z: z,
						x: coord[0],
						y: coord[1],
						symbol: deck[c],
						removed: false
					});
				}

				var board = buildBoard(tiles);
				if (solveBoard(board)) {
					return tiles;
				}
				lastBest = tiles;
			}
			// Emergency fallback: the last generated layout.
			return lastBest;
		}

		/* ============================================================
		   BOARD MODEL
		   ============================================================ */
		function makeKey(z, x, y) { return z + ',' + x + ',' + y; }

		function buildBoard(tiles) {
			var board = new Map();
			for (var i = 0; i < tiles.length; i++) {
				var t = tiles[i];
				t.key = makeKey(t.z, t.x, t.y);
				board.set(t.key, t);
			}
			return board;
		}

		function hasTile(board, z, x, y) {
			var t = board.get(makeKey(z, x, y));
			return !!t && !t.removed;
		}

		/* Rule: a tile is free when:
		   - nothing EXACTLY above it (z+1, x, y) — planes are aligned-stacked
		   - NOT blocked on BOTH sides (left x-2 and right x+2, same z)
		*/
		function isFree(board, tile) {
			if (tile.removed) return false;
			if (hasTile(board, tile.z + 1, tile.x, tile.y)) return false;

			var hasLeft = hasTile(board, tile.z, tile.x - 2, tile.y);
			var hasRight = hasTile(board, tile.z, tile.x + 2, tile.y);
			return !(hasLeft && hasRight);
		}

		function getFreeTiles(board) {
			var free = [];
			board.forEach(function (t) {
				if (!t.removed && isFree(board, t)) free.push(t);
			});
			return free;
		}

		/* ============================================================
		   SOLVER — DFS with heuristic (fewest free first)
		   Verifies that a given layout is fully winnable.
		   ============================================================ */
		function solveBoard(board) {
			var tileList = Array.from(board.values());
			var removed = new Set();

			function hasLive(z, x, y) {
				var t = board.get(makeKey(z, x, y));
				return !!t && !t.removed && !removed.has(t.key);
			}

			function isFreeForSolver(t) {
				if (removed.has(t.key)) return false;
				if (hasLive(t.z + 1, t.x, t.y)) return false;
				var hasLeft = hasLive(t.z, t.x - 2, t.y);
				var hasRight = hasLive(t.z, t.x + 2, t.y);
				return !(hasLeft && hasRight);
			}

			function getFree() {
				var free = [];
				for (var i = 0; i < tileList.length; i++) {
					var t = tileList[i];
					if (!removed.has(t.key) && isFreeForSolver(t)) free.push(t);
				}
				return free;
			}

			function rec() {
				if (removed.size === tileList.length) return true;
				var free = getFree();
				if (free.length === 0) return false;

				var bySym = {};
				for (var i = 0; i < free.length; i++) {
					var s = free[i].symbol;
					(bySym[s] = bySym[s] || []).push(free[i]);
				}

				var syms = Object.keys(bySym).sort(function (a, b) {
					return bySym[a].length - bySym[b].length;
				});

				for (var g = 0; g < syms.length; g++) {
					var members = bySym[syms[g]];
					for (var i2 = 0; i2 < members.length; i2++) {
						for (var j = i2 + 1; j < members.length; j++) {
							var a = members[i2], b = members[j];
							removed.add(a.key);
							removed.add(b.key);
							if (rec()) return true;
							removed.delete(a.key);
							removed.delete(b.key);
						}
					}
				}
				return false;
			}

			return rec();
		}

		/* ============================================================
		   RENDERING — aligned grid, no Z offset (planes overlay exactly)
		   ============================================================ */
		var TILE_W = 42, TILE_H = 48;
		var STEP_X = 22, STEP_Y = 48;   // rows/cols touch, perfectly aligned
		var Z_RISE = 8;                  // upper plane lifts 8px for depth

		var boardEl = document.getElementById('board');
		var boardWrapEl = document.getElementById('board-wrap');
		var timerEl = document.getElementById('timer');
		var pairsLeftEl = document.getElementById('pairs-left');
		var scoreEl = document.getElementById('score');

		function computeMetrics(tiles) {
			var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, maxZ = 0;
			tiles.forEach(function (t) {
				if (t.x < minX) minX = t.x;
				if (t.x > maxX) maxX = t.x;
				if (t.y < minY) minY = t.y;
				if (t.y > maxY) maxY = t.y;
				if (t.z > maxZ) maxZ = t.z;
			});
			return { minX: minX, maxX: maxX, minY: minY, maxY: maxY, maxZ: maxZ };
		}

		function renderBoard() {
			boardEl.innerHTML = '';
			var m = computeMetrics(app.tiles);

			var width = (m.maxX - m.minX) * STEP_X + TILE_W + 10;
			var height = (m.maxY - m.minY) * STEP_Y + m.maxZ * Z_RISE + TILE_H + 10;
			boardEl.style.width = width + 'px';
			boardEl.style.height = height + 'px';

			for (var i = 0; i < app.tiles.length; i++) {
				var t = app.tiles[i];
				var el = document.createElement('div');
				el.className = 'tile';
				el.dataset.key = t.key;
				el.style.left = ((t.x - m.minX) * STEP_X) + 'px';
				el.style.top = ((t.y - m.minY) * STEP_Y - t.z * Z_RISE) + 'px';
				el.style.zIndex = 10 + t.z * 10;
				el.textContent = t.symbol;
				el.addEventListener('click', (function (tile) {
					return function () { handleClick(tile); };
				})(t));
				boardEl.appendChild(el);
			}

			fitBoard(width, height);
			updateClasses();
		}

		function fitBoard(width, height) {
			var wrapW = boardWrapEl.clientWidth || window.innerWidth;
			var wrapH = boardWrapEl.clientHeight || window.innerHeight;
			var scale = Math.min(1, (wrapW - 8) / width, (wrapH - 8) / height);
			boardEl.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
		}

		function updateClasses() {
			var cells = boardEl.querySelectorAll('.tile');
			for (var i = 0; i < cells.length; i++) {
				var el = cells[i];
				var t = app.board.get(el.dataset.key);
				el.className = 'tile';
				if (!t || t.removed) {
					el.classList.add('removed');
					el.style.display = 'none';
					continue;
				}
				el.style.display = 'flex';
				if (isFree(app.board, t)) {
					el.classList.add('free');
				} else {
					el.classList.add('blocked');
				}
				if (app.selected && app.selected.key === t.key) el.classList.add('selected');
				if (t.hinted) el.classList.add('match-hint');
			}
		}

		/* ============================================================
		   APP STATE + GAME FLOW
		   ============================================================ */
		var app = {
			tiles: [],
			board: null,
			selected: null,
			score: 0,
			elapsed: 0,
			timerInterval: null,
			timerStarted: false,
			history: []
		};

		function pairsLeft() {
			var count = 0;
			app.tiles.forEach(function (t) { if (!t.removed) count++; });
			return count / 2;
		}

		function startTimer() {
			if (app.timerInterval) return;
			app.timerStarted = true;
			app.timerInterval = setInterval(function () {
				app.elapsed++;
				timerEl.textContent = app.elapsed;
			}, 1000);
		}

		function stopTimer() {
			if (app.timerInterval) { clearInterval(app.timerInterval); app.timerInterval = null; }
		}

		function handleClick(tile) {
			if (tile.removed || !isFree(app.board, tile)) return;
			if (!app.timerStarted) startTimer();

			if (app.selected) {
				if (app.selected.key === tile.key) {
					app.selected = null;
					updateClasses();
					return;
				}
				if (app.selected.symbol === tile.symbol) {
					match(app.selected, tile);
					return;
				}
				app.selected = null;
			}
			app.selected = tile;
			updateClasses();
		}

		function match(a, b) {
			a.removed = true;
			b.removed = true;
			app.history.push([a, b]);
			app.selected = null;
			app.score += 100;
			scoreEl.textContent = app.score;
			pairsLeftEl.textContent = pairsLeft();
			updateClasses();
			if (pairsLeft() === 0) levelComplete();
		}

		function undo() {
			if (app.history.length === 0) return;
			var pair = app.history.pop();
			pair[0].removed = false;
			pair[1].removed = false;
			updateClasses();
			pairsLeftEl.textContent = pairsLeft();
		}

		function hint() {
			var free = getFreeTiles(app.board);
			var bySymbol = {};
			free.forEach(function (t) {
				(bySymbol[t.symbol] = bySymbol[t.symbol] || []).push(t);
			});
			for (var sym in bySymbol) {
				if (bySymbol[sym].length >= 2) {
					bySymbol[sym][0].hinted = true;
					bySymbol[sym][1].hinted = true;
					updateClasses();
					setTimeout(function () {
						bySymbol[sym][0].hinted = false;
						bySymbol[sym][1].hinted = false;
						updateClasses();
					}, 2000);
					return;
				}
			}
		}

		function levelComplete() {
			stopTimer();
			modalTitle.textContent = 'Cleared!';
			overlay.style.display = 'flex';
		}

		/* ============================================================
		   INIT
		   ============================================================ */
		function startGame() {
			app.tiles = buildStaticLayout();
			app.board = buildBoard(app.tiles);
			app.selected = null;
			app.score = 0;
			app.elapsed = 0;
			app.history = [];
			app.timerStarted = false;
			stopTimer();
			timerEl.textContent = '0';
			scoreEl.textContent = '0';
			pairsLeftEl.textContent = pairsLeft();
			overlay.style.display = 'none';
			renderBoard();
		}

		var overlay = document.createElement('div');
		var modalTitle = document.createElement('h2');
		overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:1000;';
		overlay.style.display = 'none';
		modalTitle.style.cssText = 'color:#fff;font-size:2rem;background:#1e293b;padding:24px 40px;border-radius:16px;';
		overlay.appendChild(modalTitle);
		document.body.appendChild(overlay);

		document.getElementById('btn-hint').addEventListener('click', hint);
		document.getElementById('btn-undo').addEventListener('click', undo);
		document.getElementById('btn-new').addEventListener('click', startGame);

		window.addEventListener('resize', function () {
			if (!app.tiles.length) return;
			var m = computeMetrics(app.tiles);
			var width = (m.maxX - m.minX) * STEP_X + TILE_W + 10;
			var height = (m.maxY - m.minY) * STEP_Y + m.maxZ * Z_RISE + TILE_H + 10;
			fitBoard(width, height);
		});

		startGame();
	})();
	</script>
</body>
</html>
