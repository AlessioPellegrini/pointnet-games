<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <!-- Top Left Number Badge -->
  <g transform="translate(22, 22)">
    <rect x="0" y="0" width="38" height="48" rx="6" fill="#2a2a2a" stroke="#ff5252" stroke-width="2" />
    <text x="19" y="34" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#ff5252" text-anchor="middle">4</text>
  </g>
  <!-- Top Right Romanized Tag -->
  <text x="274" y="54" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="20" fill="#ff5252" text-anchor="end" letter-spacing="1">BAMBOO</text>
  
  <!-- Artwork -->
  <g transform="translate(150, 160)">
    
    <!-- Bamboo Stalks & Leaves -->
    <path d="M-25,45 L-25,-45" stroke="#2e7d32" stroke-width="10" stroke-linecap="round"/>
    <line x1="-31" y1="-15" x2="-19" y2="-15" stroke="#1b5e20" stroke-width="3"/>
    <line x1="-31" y1="15" x2="-19" y2="15" stroke="#1b5e20" stroke-width="3"/>
    <path d="M20,45 L20,-35" stroke="#2e7d32" stroke-width="8" stroke-linecap="round"/>
    <line x1="15" y1="5" x2="25" y2="5" stroke="#1b5e20" stroke-width="3"/>
    <!-- Leaves -->
    <path d="M-25,-15 Q-55,-30 -60,-50 Q-40,-35 -25,-15" fill="#ff7043"/>
    <path d="M-25,-15 Q-50,-10 -65,-5 Q-40,-5 -25,-15" fill="#ff7043"/>
    <path d="M20,5 Q55,-10 70,-25 Q45,-5 20,5" fill="#ff7043"/>
    <path d="M20,5 Q50,20 65,30 Q45,15 20,5" fill="#ff7043"/>
    <path d="M-25,15 Q0,-5 15,-20 Q0,5 -25,15" fill="#ff7043"/>
  </g>

  <!-- Traditional Hanzi Character -->
  <text x="150" y="350" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif" font-weight="900" font-size="128" fill="#ffffff" text-anchor="middle">竹</text>
</svg>