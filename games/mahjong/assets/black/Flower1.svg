<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <!-- Top Left Number Badge -->
  <g transform="translate(22, 22)">
    <rect x="0" y="0" width="38" height="48" rx="6" fill="#2a2a2a" stroke="#ff5252" stroke-width="2" />
    <text x="19" y="34" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#ff5252" text-anchor="middle">1</text>
  </g>
  <!-- Top Right Romanized Tag -->
  <text x="274" y="54" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="20" fill="#ff5252" text-anchor="end" letter-spacing="1">PLUM</text>
  
  <!-- Artwork -->
  <g transform="translate(150, 160)">
    
    <!-- Plum Blossom Branch & Flowers -->
    <path d="M-70,30 Q-25,5 0,-15 T70,-45" fill="none" stroke="#5d4037" stroke-width="7" stroke-linecap="round"/>
    <path d="M-20,10 Q-38,-20 -50,-35" fill="none" stroke="#5d4037" stroke-width="5" stroke-linecap="round"/>
    <path d="M20,-20 Q40,-5 58,12" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(0, -15)">
      <circle cx="0" cy="-22" r="18" fill="#ff7043"/>
      <circle cx="21" cy="-7" r="18" fill="#ff7043"/>
      <circle cx="13" cy="18" r="18" fill="#ff7043"/>
      <circle cx="-13" cy="18" r="18" fill="#ff7043"/>
      <circle cx="-21" cy="-7" r="18" fill="#ff7043"/>
      <circle cx="0" cy="0" r="12" fill="#ffebee"/>
      <circle cx="0" cy="0" r="6" fill="#ffd54f"/>
    </g>
    <g transform="translate(-50, -35)"><circle cx="-4" cy="-6" r="10" fill="#ff7043"/><circle cx="6" cy="-4" r="10" fill="#ff7043"/><circle cx="0" cy="5" r="10" fill="#ff7043"/><circle cx="0" cy="0" r="3" fill="#ffd54f"/></g>
    <g transform="translate(58, 12)"><circle cx="-4" cy="-4" r="9" fill="#ff7043"/><circle cx="5" cy="-4" r="9" fill="#ff7043"/><circle cx="0" cy="5" r="9" fill="#ff7043"/><circle cx="0" cy="0" r="3" fill="#ffd54f"/></g>
  </g>

  <!-- Traditional Hanzi Character -->
  <text x="150" y="350" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif" font-weight="900" font-size="128" fill="#ffffff" text-anchor="middle">梅</text>
