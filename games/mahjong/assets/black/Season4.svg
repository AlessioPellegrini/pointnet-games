<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <!-- Top Left Number Badge -->
  <g transform="translate(22, 22)">
    <rect x="0" y="0" width="38" height="48" rx="6" fill="#2a2a2a" stroke="#64b5f6" stroke-width="2" />
    <text x="19" y="34" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#64b5f6" text-anchor="middle">4</text>
  </g>
  <!-- Top Right Romanized Tag -->
  <text x="274" y="54" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="20" fill="#64b5f6" text-anchor="end" letter-spacing="1">WINTER</text>
  
  <!-- Artwork -->
  <g transform="translate(150, 160)">
    
    <!-- Winter Crystal Snowflake & Evergreen -->
    <g transform="translate(0, -10)">
      <!-- 6-point Snowflake -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#81d4fa" stroke-width="5" stroke-linecap="round"/>
      <line x1="-39" y1="-22.5" x2="39" y2="22.5" stroke="#81d4fa" stroke-width="5" stroke-linecap="round"/>
      <line x1="-39" y1="22.5" x2="39" y2="-22.5" stroke="#81d4fa" stroke-width="5" stroke-linecap="round"/>
      <!-- V branchlets -->
      <path d="M-12,-30 L0,-20 L12,-30" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
      <path d="M-12,30 L0,20 L12,30" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
      <path d="M-30,-5 L-20,-12 L-25,-25" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
      <path d="M30,5 L20,12 L25,25" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
      <path d="M-30,5 L-20,12 L-25,25" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
      <path d="M30,-5 L20,-12 L25,-25" fill="none" stroke="#81d4fa" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="8" fill="#e1f5fe"/>
      <circle cx="0" cy="0" r="4" fill="#81d4fa"/>
    </g>
  </g>

  <!-- Traditional Hanzi Character -->
  <text x="150" y="350" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif" font-weight="900" font-size="128" fill="#ffffff" text-anchor="middle">冬</text>
</svg>