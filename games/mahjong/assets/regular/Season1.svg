<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <!-- Top Left Number Badge -->
  <g transform="translate(22, 22)">
    <rect x="0" y="0" width="38" height="48" rx="6" fill="#1b7340"  />
    <text x="19" y="34" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">1</text>
  </g>
  <!-- Top Right Romanized Tag -->
  <text x="274" y="54" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" font-size="20" fill="#1b7340" text-anchor="end" letter-spacing="1">SPRING</text>
  
  <!-- Artwork -->
  <g transform="translate(150, 160)">
    
    <!-- Spring Sun & Green Sprout -->
    <circle cx="0" cy="-25" r="22" fill="#fbc02d"/>
    <path d="M-40,-25 L-25,-25" stroke="#fbc02d" stroke-width="4" stroke-linecap="round"/>
    <path d="M25,-25 L40,-25" stroke="#fbc02d" stroke-width="4" stroke-linecap="round"/>
    <path d="M0,-65 L0,-50" stroke="#fbc02d" stroke-width="4" stroke-linecap="round"/>
    <path d="M-28,-53 L-18,-43" stroke="#fbc02d" stroke-width="4" stroke-linecap="round"/>
    <path d="M28,-53 L18,-43" stroke="#fbc02d" stroke-width="4" stroke-linecap="round"/>
    <!-- Fresh Sprout -->
    <path d="M0,45 Q0,10 0,0" stroke="#2e7d32" stroke-width="7" stroke-linecap="round"/>
    <path d="M0,10 Q-35,0 -40,-25 Q-15,-15 0,10" fill="#43a047"/>
    <path d="M0,5 Q35,-5 40,-30 Q15,-20 0,5" fill="#43a047"/>
  </g>

  <!-- Traditional Hanzi Character -->
  <text x="150" y="350" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif" font-weight="900" font-size="128" fill="#1b7340" text-anchor="middle">春</text>
</svg>